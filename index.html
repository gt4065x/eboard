<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Live Collab E-Board</title>

  <!-- Tailwind (dev) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    body { background-color: #111827; margin: 0; overflow: hidden; touch-action: none; }
    canvas { touch-action: none; cursor: crosshair; }
    .glass-panel { background: rgba(31, 41, 55, 0.85); backdrop-filter: blur(10px); }

    .text-input-overlay {
      position: absolute;
      background: rgba(17, 24, 39, 0.6);
      border: 1px dashed #10b981;
      color: white;
      outline: none;
      padding: 4px 8px;
      font-family: sans-serif;
      z-index: 60;
      white-space: nowrap;
      border-radius: 10px;
    }
    .room-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collection, doc,
      setDoc, addDoc,
      onSnapshot,
      serverTimestamp,
      query, where, orderBy, limit,
      getDoc,
      writeBatch,
      runTransaction,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const h = React.createElement;
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // -----------------------------
    // Firebase Config
    // -----------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDK2VURk2eqaRy52yi2sPZuwYVb2ymmR3I",
      authDomain: "eboard-95055.firebaseapp.com",
      databaseURL: "https://eboard-95055-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "eboard-95055",
      storageBucket: "eboard-95055.firebasestorage.app",
      messagingSenderId: "927523134440",
      appId: "1:927523134440:web:4a546e6c565368e283e25d",
      measurementId: "G-BCPK0YX0E3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Lobby ID
    const LOBBY_ID = "eboard-lobby-v1";
    const globalAppId = (typeof __app_id !== "undefined" && __app_id) ? __app_id : LOBBY_ID;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const nowISO = () => new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

    function useInterval(fn, ms) {
      const fnRef = useRef(fn);
      useEffect(() => { fnRef.current = fn; }, [fn]);
      useEffect(() => {
        if (!ms) return;
        const id = setInterval(() => fnRef.current(), ms);
        return () => clearInterval(id);
      }, [ms]);
    }

    const IconBtn = ({ title, onClick, active, disabled, children, className }) => (
      h("button", {
        title,
        onClick,
        disabled,
        className:
          (className || "") +
          " p-2 rounded-lg transition select-none " +
          (disabled ? " opacity-40 cursor-not-allowed " : " hover:bg-gray-800 ") +
          (active ? " bg-emerald-500/20 text-emerald-400 " : " text-gray-300 ")
      }, children)
    );

    function App() {
      const [user, setUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [roomInfo, setRoomInfo] = useState({
        id: "",
        nickname: localStorage.getItem("eboard_nick") || ""
      });

      const [activeRooms, setActiveRooms] = useState([]);

      const [currentPage, setCurrentPage] = useState(1);

      const [data, setData] = useState({
        strokes: [],
        texts: [],
        messages: [],
        users: []
      });

      const [ui, setUi] = useState({
        color: "#10b981",
        width: 4,
        showChat: true,
        msg: "",
        tool: "text", // default text (참석자도 가능)
        showUsers: false
      });

      const [textInput, setTextInput] = useState({
        active: false,
        x: 0, y: 0,
        rawX: 0, rawY: 0,
        value: ""
      });

      const [ownerUid, setOwnerUid] = useState(null);
      const isOwner = useMemo(() => !!(user && ownerUid && user.uid === ownerUid), [user, ownerUid]);

      // 권한 정책(요청사항):
      // - 참석자: 텍스트 가능
      // - 방장: 텍스트 + 펜 + END ROOM
      const canText = true;
      const canDraw = isOwner;

      const canvasRef = useRef(null);
      const textRef = useRef(null);
      const drawingRef = useRef({ isDrawing: false, points: [] });

      // 1) Auth
      useEffect(() => {
        (async () => {
          try {
            if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Auth failed:", e);
          }
        })();

        const unsub = onAuthStateChanged(auth, (u) => setUser(u));
        return () => unsub();
      }, []);

      // 2) Lobby listener (인덱스 우회 버전)
      // - lastActivity >= cutoff
      // - orderBy(lastActivity desc)
      // - (클라이언트에서 status=="active" 필터)
      useEffect(() => {
        const cutoff = Timestamp.fromMillis(Date.now() - 24 * 60 * 60 * 1000);

        const qLobby = query(
          collection(db, "artifacts", globalAppId, "public", "data", "active_rooms"),
          where("lastActivity", ">=", cutoff),
          orderBy("lastActivity", "desc"),
          limit(80)
        );

        const unsubLobby = onSnapshot(qLobby, (snap) => {
          const rooms = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(r => (r.status || "active") === "active");

          setActiveRooms(rooms);
        }, (err) => {
          console.error("Lobby onSnapshot error:", err);
        });

        return () => unsubLobby();
      }, []);

      // 3) Ensure room_meta/meta (첫 생성자 = 방장)
      const ensureRoomMetaOwner = useCallback(async (roomId, currentUid) => {
        const metaRef = doc(db, "artifacts", roomId, "public", "data", "room_meta", "meta");
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(metaRef);
          if (!snap.exists()) {
            tx.set(metaRef, {
              ownerUid: currentUid,
              status: "active",
              createdAt: serverTimestamp()
            }, { merge: true });
          }
        });
      }, []);

      // 4) room_meta subscribe (ownerUid)
      useEffect(() => {
        if (!isLoggedIn || !roomInfo.id) return;

        const metaRef = doc(db, "artifacts", roomInfo.id, "public", "data", "room_meta", "meta");
        const unsub = onSnapshot(metaRef, (snap) => {
          if (snap.exists()) setOwnerUid(snap.data().ownerUid || null);
          else setOwnerUid(null);
        }, (err) => console.error("meta onSnapshot error:", err));

        return () => unsub();
      }, [isLoggedIn, roomInfo.id]);

      // 5) Room data sync
      useEffect(() => {
        if (!user || !isLoggedIn || !roomInfo.id) return;

        const base = ["artifacts", roomInfo.id, "public", "data"];
        const sortByTime = (arr) => {
          const copy = [...arr];
          copy.sort((a, b) => (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0));
          return copy;
        };

        const unsubStrokes = onSnapshot(collection(db, ...base, "strokes"), (s) => {
          const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
          setData(p => ({ ...p, strokes: sortByTime(rows) }));
        }, (err) => console.error("strokes onSnapshot error:", err));

        const unsubTexts = onSnapshot(collection(db, ...base, "texts"), (s) => {
          const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
          setData(p => ({ ...p, texts: sortByTime(rows) }));
        }, (err) => console.error("texts onSnapshot error:", err));

        const unsubMessages = onSnapshot(collection(db, ...base, "messages"), (s) => {
          const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
          setData(p => ({ ...p, messages: sortByTime(rows) }));
        }, (err) => console.error("messages onSnapshot error:", err));

        const unsubUsers = onSnapshot(collection(db, ...base, "users"), (s) => {
          const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
          setData(p => ({ ...p, users: rows }));
        }, (err) => console.error("users onSnapshot error:", err));

        // 참석자 등록/갱신
        setDoc(doc(db, ...base, "users", user.uid), {
          uid: user.uid,
          name: roomInfo.nickname,
          lastSeen: serverTimestamp()
        }, { merge: true }).catch(e => console.error("set users failed:", e));

        // 로비 갱신(active)
        setDoc(
          doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id),
          { roomId: roomInfo.id, status: "active", lastActivity: serverTimestamp() },
          { merge: true }
        ).catch(e => console.error("set lobby failed:", e));

        return () => { unsubStrokes(); unsubTexts(); unsubMessages(); unsubUsers(); };
      }, [user, isLoggedIn, roomInfo.id]);

      // 6) Heartbeat
      useInterval(async () => {
        if (!user || !isLoggedIn || !roomInfo.id) return;
        try {
          await setDoc(
            doc(db, "artifacts", roomInfo.id, "public", "data", "users", user.uid),
            { lastSeen: serverTimestamp() },
            { merge: true }
          );

          const lobbyRef = doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id);
          const snap = await getDoc(lobbyRef);
          const st = snap.exists() ? (snap.data().status || "active") : "active";
          if (st !== "active") return;

          await setDoc(lobbyRef, { lastActivity: serverTimestamp(), status: "active" }, { merge: true });
        } catch (e) {
          console.error("heartbeat error:", e);
        }
      }, isLoggedIn ? 15000 : null);

      // 7) Canvas redraw
      const redraw = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;

        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const wCSS = canvas.clientWidth;
        const hCSS = canvas.clientHeight;
        if (!wCSS || !hCSS) return;

        canvas.width = Math.floor(wCSS * dpr);
        canvas.height = Math.floor(hCSS * dpr);

        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, wCSS, hCSS);

        // strokes
        data.strokes
          .filter(s => (s.page || 1) === currentPage)
          .forEach(s => {
            if (!s.points || s.points.length < 2) return;
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = s.color || "#10b981";
            ctx.lineWidth = s.width || 4;

            ctx.moveTo(s.points[0].x * wCSS, s.points[0].y * hCSS);
            for (let i = 1; i < s.points.length; i++) {
              const p = s.points[i];
              ctx.lineTo(p.x * wCSS, p.y * hCSS);
            }
            ctx.stroke();
          });

        // texts
        data.texts
          .filter(t => (t.page || 1) === currentPage)
          .forEach(t => {
            ctx.fillStyle = t.color || "#ffffff";
            const px = Math.max(14, (t.fontSize || 18));
            ctx.font = `${px}px sans-serif`;
            ctx.fillText(t.text || "", (t.x || 0) * wCSS, (t.y || 0) * hCSS);
          });
      }, [data.strokes, data.texts, currentPage]);

      useEffect(() => {
        const onResize = () => redraw();
        window.addEventListener("resize", onResize);
        setTimeout(() => redraw(), 0);
        return () => window.removeEventListener("resize", onResize);
      }, [redraw]);

      useEffect(() => { redraw(); }, [redraw]);

      // 8) Input helpers
      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0];
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;
        const x = (clientX - rect.left) / rect.width;
        const y = (clientY - rect.top) / rect.height;
        return {
          x: Math.max(0, Math.min(1, x)),
          y: Math.max(0, Math.min(1, y)),
          rawX: clientX - rect.left,
          rawY: clientY - rect.top
        };
      };

      const drawStart = (e) => {
        if (!isLoggedIn) return;
        const pos = getPos(e);

        // 텍스트는 누구나 가능
        if (ui.tool === "text") {
          if (!canText) return;
          setTextInput({
            active: true,
            x: pos.x, y: pos.y,
            rawX: pos.rawX, rawY: pos.rawY,
            value: ""
          });
          return;
        }

        // 펜은 방장만
        if (!canDraw) return;

        drawingRef.current.isDrawing = true;
        drawingRef.current.points = [{ x: pos.x, y: pos.y }];
      };

      const drawMove = (e) => {
        if (!drawingRef.current.isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const pos = getPos(e);
        const pts = drawingRef.current.points;
        pts.push({ x: pos.x, y: pos.y });

        const wCSS = canvas.clientWidth;
        const hCSS = canvas.clientHeight;

        const last = pts[pts.length - 2];
        ctx.beginPath();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = ui.color;
        ctx.lineWidth = ui.width;
        ctx.moveTo(last.x * wCSS, last.y * hCSS);
        ctx.lineTo(pos.x * wCSS, pos.y * hCSS);
        ctx.stroke();
      };

      const drawEnd = async () => {
        if (!drawingRef.current.isDrawing) return;
        drawingRef.current.isDrawing = false;

        const pts = drawingRef.current.points;
        if (!pts || pts.length < 2) return;

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "strokes"),
            {
              points: pts,
              color: ui.color,
              width: ui.width,
              page: currentPage,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );

          await setDoc(
            doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id),
            { lastActivity: serverTimestamp(), status: "active" },
            { merge: true }
          );
        } catch (e) {
          console.error("add stroke failed:", e);
          alert("그리기 저장 실패(규칙/권한/네트워크). 콘솔 확인!");
        }
      };

      const submitText = async () => {
        const v = (textInput.value || "").trim();
        setTextInput(p => ({ ...p, active: false }));

        if (!v) return;
        if (!canText) return;

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "texts"),
            {
              text: v,
              x: textInput.x,
              y: textInput.y,
              color: ui.color,
              fontSize: Math.max(16, ui.width * 4),
              page: currentPage,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );

          await setDoc(
            doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id),
            { lastActivity: serverTimestamp(), status: "active" },
            { merge: true }
          );
        } catch (e) {
          console.error("add text failed:", e);
          alert("텍스트 저장 실패(규칙/권한/네트워크). 콘솔 확인!");
        }
      };

      // 9) Save PNG
      const exportBoardAsImage = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        redraw();
        const url = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = `board_${roomInfo.id}_p${currentPage}_${nowISO()}.png`;
        a.click();
      };

      // 10) End Room (방장)
      const endRoom = async () => {
        if (!isOwner) return;
        const ok = confirm("회의를 종료할까요? (로비에서 방이 숨김 처리됩니다)");
        if (!ok) return;

        try {
          const lobbyRef = doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id);
          const metaRef  = doc(db, "artifacts", roomInfo.id, "public", "data", "room_meta", "meta");

          const batch = writeBatch(db);
          batch.set(lobbyRef, {
            roomId: roomInfo.id,
            status: "closed",
            endedAt: serverTimestamp(),
            lastActivity: serverTimestamp(),
            activeUserCount: 0
          }, { merge: true });

          batch.set(metaRef, {
            status: "closed",
            endedAt: serverTimestamp()
          }, { merge: true });

          await batch.commit();
          alert("회의가 종료되었습니다. 로비에서 숨김 처리됩니다.");
          window.location.reload();
        } catch (e) {
          console.error("endRoom failed:", e);
          alert("회의 종료 실패. 콘솔 로그를 확인해주세요.");
        }
      };

      // 11) Login / Create room (closed 방 차단)
      const generateNewRoomId = () => {
        const randomId = "Room-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        setRoomInfo(p => ({ ...p, id: randomId }));
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const nick = (roomInfo.nickname || "").trim();
        const rid  = (roomInfo.id || "").trim();
        if (!nick || !rid) return;

        localStorage.setItem("eboard_nick", nick);

        try {
          const lobbyRef = doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", rid);
          const snap = await getDoc(lobbyRef);

          if (snap.exists()) {
            const st = snap.data().status || "active";
            if (st === "closed") {
              alert("이 방은 종료된 회의입니다. 다른 방 이름으로 생성하거나 다른 방에 입장하세요.");
              return;
            }
            await setDoc(lobbyRef, { lastActivity: serverTimestamp(), status: "active", roomId: rid }, { merge: true });
          } else {
            await setDoc(lobbyRef, {
              roomId: rid,
              status: "active",
              createdAt: serverTimestamp(),
              lastActivity: serverTimestamp(),
              activeUserCount: 0
            }, { merge: true });
          }

          if (user?.uid) {
            await ensureRoomMetaOwner(rid, user.uid);
          }

          setIsLoggedIn(true);
        } catch (e2) {
          console.error("handleLogin failed:", e2);
          alert("입장 실패. Firestore/규칙/인덱스를 확인하세요.");
        }
      };

      useEffect(() => {
        if (!isLoggedIn) return;
        if (!user?.uid) return;
        if (!roomInfo.id) return;
        ensureRoomMetaOwner(roomInfo.id, user.uid).catch(e => console.error("ensureRoomMetaOwner failed:", e));
      }, [isLoggedIn, user, roomInfo.id]);

      // 12) Chat send
      const sendChat = async (e) => {
        e.preventDefault();
        const v = (ui.msg || "").trim();
        if (!v) return;

        setUi(p => ({ ...p, msg: "" }));

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "messages"),
            {
              text: v,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );

          await setDoc(
            doc(db, "artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id),
            { lastActivity: serverTimestamp(), status: "active" },
            { merge: true }
          );
        } catch (e2) {
          console.error("sendChat failed:", e2);
          alert("채팅 전송 실패. 콘솔 확인!");
        }
      };

      // -----------------------------
      // UI: Login screen
      // -----------------------------
      if (!isLoggedIn) {
        return h("div", { className: "h-screen w-full flex items-center justify-center bg-gray-900 p-6 overflow-y-auto" },
          h("div", { className: "max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start" },

            h("div", { className: "bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6" },
              h("div", null,
                h("h1", { className: "text-3xl font-black text-white bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 uppercase tracking-tighter" }, "E-Board Collab"),
                h("p", { className: "text-gray-400 text-sm mt-1" }, "실시간 협업 칠판 (참석자: 텍스트만 / 방장: 펜+텍스트)")
              ),

              h("form", { onSubmit: handleLogin, className: "space-y-4" },
                h("div", { className: "space-y-4" },

                  h("div", null,
                    h("label", { className: "text-[10px] text-gray-500 mb-1 block uppercase font-bold tracking-widest" }, "사용자 닉네임"),
                    h("input", {
                      type: "text",
                      value: roomInfo.nickname,
                      onChange: (e) => setRoomInfo(p => ({ ...p, nickname: e.target.value })),
                      className: "w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition",
                      placeholder: "이름을 입력하세요",
                      required: true
                    })
                  ),

                  h("div", { className: "pt-2" },
                    h("div", { className: "flex justify-between items-end mb-1" },
                      h("label", { className: "text-[10px] text-gray-500 uppercase font-bold tracking-widest" }, "방 이름 (ID)"),
                      h("button", {
                        type: "button",
                        onClick: generateNewRoomId,
                        className: "text-[10px] text-emerald-400 font-bold hover:underline flex items-center gap-1"
                      }, "+ 새 회의 만들기")
                    ),
                    h("input", {
                      type: "text",
                      value: roomInfo.id,
                      onChange: (e) => setRoomInfo(p => ({ ...p, id: e.target.value })),
                      className: "w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition",
                      placeholder: "예: ECOBIO, Project1",
                      required: true
                    }),
                    h("div", { className: "mt-2 text-[11px] text-gray-500 leading-relaxed" },
                      "로비에는 최근 24시간 활동한 방만 표시됩니다. ",
                      "방장이 END ROOM을 누르면 로비에서 숨김 처리됩니다."
                    )
                  )
                ),

                h("button", {
                  type: "submit",
                  className: "w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-500/20 uppercase tracking-widest mt-4"
                }, "입장하기")
              )
            ),

            h("div", { className: "space-y-4" },
              h("div", { className: "flex items-center justify-between px-2" },
                h("h2", { className: "text-xs font-bold text-gray-400 uppercase tracking-widest" }, "최근 24시간 활동 방"),
                h("span", { className: "text-[10px] bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full border border-gray-700" }, "Lobby")
              ),

              h("div", { className: "space-y-2 max-h-[520px] overflow-y-auto pr-2 custom-scrollbar" },
                activeRooms.length === 0
                  ? h("div", { className: "p-12 border-2 border-dashed border-gray-800 rounded-3xl text-center flex flex-col items-center gap-3" },
                      h("div", { className: "p-3 bg-gray-800 rounded-full text-gray-600" }, "👥"),
                      h("div", { className: "text-gray-600 text-sm font-medium" },
                        "현재 진행 중인 회의가 없습니다.",
                        h("br"),
                        h("span", { className: "text-xs opacity-60" }, "새 회의를 직접 만들어보세요!")
                      )
                    )
                  : activeRooms.map(room =>
                      h("button", {
                        key: room.id,
                        onClick: () => setRoomInfo(p => ({ ...p, id: room.id })),
                        className: "w-full room-card bg-gray-800/40 hover:bg-gray-800 border border-gray-700/50 hover:border-emerald-500/50 p-5 rounded-2xl flex justify-between items-center transition group text-left shadow-sm"
                      },
                        h("div", { className: "space-y-1" },
                          h("div", { className: "text-emerald-400 font-black text-xl tracking-tight uppercase" }, room.id),
                          h("div", { className: "flex items-center gap-2 text-[10px] text-gray-500 font-mono" },
                            "🕒 ",
                            "최근 활동: ",
                            room.lastActivity?.toMillis ? new Date(room.lastActivity.toMillis()).toLocaleTimeString() : "방금 전"
                          )
                        ),
                        h("div", { className: "h-10 w-10 flex items-center justify-center rounded-xl bg-emerald-500/10 text-emerald-500 group-hover:bg-emerald-500 group-hover:text-white transition-all" }, "→")
                      )
                    )
              )
            )
          )
        );
      }

      // Board UI
      const onlineCount = data.users.length;

      return h("div", { className: "h-screen w-full flex flex-col bg-gray-950 text-white overflow-hidden" },

        h("header", { className: "h-14 glass-panel border-b border-gray-800 flex items-center justify-between px-6 z-20 relative" },
          h("div", { className: "flex items-center gap-4" },
            h("span", { className: "font-black text-lg text-emerald-400 tracking-tighter" }, "BOARD."),
            h("div", { className: "h-6 w-px bg-gray-800 mx-1" }),
            h("div", { className: "flex items-center gap-2 text-[10px] font-mono text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800" },
              h("span", { className: "text-white" }, `ROOM: ${roomInfo.id}`),
              h("span", { className: "text-emerald-500 font-bold uppercase" }, `● ${onlineCount} ONLINE`),
              isOwner
                ? h("span", { className: "ml-2 text-[10px] text-emerald-300 font-bold" }, "(방장 · 펜+텍스트)")
                : h("span", { className: "ml-2 text-[10px] text-gray-400" }, "(참석자 · 텍스트만)")
            )
          ),

          h("div", { className: "flex items-center gap-2" },
            IconBtn({ title: "참석자", onClick: () => setUi(p => ({ ...p, showUsers: !p.showUsers })), active: ui.showUsers }, "👥"),

            h("div", { className: "h-6 w-px bg-gray-800 mx-1" }),

            IconBtn({ title: "이전 페이지", onClick: () => setCurrentPage(p => Math.max(1, p - 1)), disabled: currentPage === 1 }, "◀"),
            h("span", { className: "text-xs font-bold font-mono px-2" }, `P. ${currentPage}`),
            IconBtn({ title: "다음 페이지", onClick: () => setCurrentPage(p => p + 1) }, "▶"),

            h("div", { className: "h-6 w-px bg-gray-800 mx-1" }),

            IconBtn({ title: "채팅 패널", onClick: () => setUi(p => ({ ...p, showChat: !p.showChat })), active: ui.showChat }, "💬"),
            IconBtn({ title: "PNG 저장", onClick: exportBoardAsImage }, "🖼️"),

            isOwner ? IconBtn({ title: "회의 종료(방장)", onClick: endRoom, className: " !text-red-300 hover:!bg-red-500/20 " }, "END") : null,

            h("button", {
              onClick: () => { if (confirm("회의에서 나가시겠습니까?")) window.location.reload(); },
              className: "p-2 text-xs font-bold text-gray-500 hover:text-white transition"
            }, "LEAVE")
          ),

          ui.showUsers ? h("div", { className: "absolute top-14 left-6 w-72 glass-panel border border-gray-800 rounded-2xl p-3 z-30" },
            h("div", { className: "text-xs text-gray-300 font-bold mb-2 flex items-center justify-between" },
              h("span", null, "참석자"),
              h("span", { className: "text-[10px] text-gray-500 font-mono" }, `${onlineCount}`)
            ),
            h("div", { className: "space-y-2 max-h-64 overflow-auto pr-1" },
              data.users
                .slice()
                .sort((a,b) => (a.uid === ownerUid ? -1 : 0) - (b.uid === ownerUid ? -1 : 0))
                .map(u => h("div", {
                  key: u.id,
                  className: "flex items-center justify-between bg-gray-900/40 border border-gray-800 rounded-xl px-3 py-2"
                },
                  h("div", { className: "flex flex-col" },
                    h("div", { className: "text-sm text-white" },
                      u.name || "Unknown",
                      (u.uid === ownerUid) ? h("span", { className: "ml-2 text-[10px] text-emerald-400 font-bold" }, "(방장)") : null
                    ),
                    h("div", { className: "text-[10px] text-gray-500 font-mono" }, (u.uid || "").slice(0, 8))
                  ),
                  h("div", { className: "text-[10px] text-gray-500" },
                    u.lastSeen?.toMillis ? new Date(u.lastSeen.toMillis()).toLocaleTimeString() : ""
                  )
                ))
            )
          ) : null
        ),

        h("div", { className: "flex-1 flex relative" },

          h("div", { className: "flex-1 relative overflow-hidden bg-[radial-gradient(#1f2937_1px,transparent_1px)] [background-size:24px_24px]" },

            h("canvas", {
              ref: canvasRef,
              className: "block w-full h-full",
              onMouseDown: (e) => { e.preventDefault(); drawStart(e); },
              onMouseMove: (e) => { e.preventDefault(); drawMove(e); },
              onMouseUp:   (e) => { e.preventDefault(); drawEnd(); },
              onMouseLeave:(e) => { e.preventDefault(); drawEnd(); },
              onTouchStart:(e) => { e.preventDefault(); drawStart(e); },
              onTouchMove: (e) => { e.preventDefault(); drawMove(e); },
              onTouchEnd:  (e) => { e.preventDefault(); drawEnd(); }
            }),

            textInput.active ? h("input", {
              ref: textRef,
              type: "text",
              className: "text-input-overlay",
              style: {
                left: `${textInput.rawX}px`,
                top:  `${Math.max(0, textInput.rawY - (ui.width * 2))}px`,
                color: ui.color,
                fontSize: `${Math.max(16, ui.width * 4)}px`,
                minWidth: "160px"
              },
              value: textInput.value,
              onChange: (e) => setTextInput(p => ({ ...p, value: e.target.value })),
              onBlur: submitText,
              onKeyDown: (e) => { if (e.key === "Enter") submitText(); },
              autoFocus: true
            }) : null,

            h("div", { className: "absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel border border-gray-700 px-6 py-3 rounded-3xl flex items-center gap-6 shadow-2xl" },

              h("div", { className: "flex gap-2 p-1 bg-gray-900/50 rounded-xl" },
                h("button", {
                  onClick: () => setUi(p => ({ ...p, tool: "text" })),
                  className: "p-2 rounded-lg transition " + (ui.tool === "text" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white")
                }, "T"),

                h("button", {
                  onClick: () => setUi(p => ({ ...p, tool: "pencil" })),
                  disabled: !canDraw,
                  className:
                    "p-2 rounded-lg transition " +
                    (ui.tool === "pencil" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white") +
                    (!canDraw ? " opacity-40 cursor-not-allowed" : "")
                }, "✏️")
              ),

              h("div", { className: "flex gap-3" },
                ["#10b981", "#ef4444", "#3b82f6", "#ffffff"].map(c =>
                  h("button", {
                    key: c,
                    onClick: () => setUi(p => ({ ...p, color: c })),
                    className:
                      "w-6 h-6 rounded-full border-2 transition " +
                      (ui.color === c ? "border-white scale-110 ring-4 ring-white/10" : "border-transparent opacity-60"),
                    style: { backgroundColor: c }
                  })
                )
              ),

              h("div", { className: "flex items-center gap-2" },
                h("span", { className: "text-[10px] text-gray-400 font-mono" }, "W"),
                h("input", {
                  type: "range",
                  min: 2,
                  max: 12,
                  value: ui.width,
                  onChange: (e) => setUi(p => ({ ...p, width: parseInt(e.target.value, 10) })),
                })
              )
            )
          ),

          h("div", {
            className:
              "transition-all duration-300 " +
              (ui.showChat ? "w-80 border-l border-gray-800" : "w-0 overflow-hidden") +
              " flex flex-col glass-panel"
          },
            h("div", { className: "flex-1 overflow-y-auto p-4 space-y-4" },
              data.messages.map((m, i) =>
                h("div", {
                  key: m.id || i,
                  className: "flex flex-col " + (m.userId === user?.uid ? "items-end" : "items-start")
                },
                  h("span", { className: "text-[10px] text-gray-500 mb-1 px-1 font-mono uppercase tracking-tighter" }, m.userName || "User"),
                  h("div", {
                    className:
                      "max-w-[90%] px-3 py-2 text-sm rounded-2xl shadow-sm " +
                      (m.userId === user?.uid
                        ? "bg-emerald-600 text-white rounded-tr-none"
                        : "bg-gray-800 text-gray-200 rounded-tl-none border border-gray-700/50")
                  }, m.text || "")
                )
              )
            ),

            h("form", { onSubmit: sendChat, className: "p-4 bg-gray-900 border-t border-gray-800 flex gap-2" },
              h("input", {
                type: "text",
                value: ui.msg,
                onChange: (e) => setUi(p => ({ ...p, msg: e.target.value })),
                placeholder: "채팅 입력...",
                className: "flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500"
              }),
              h("button", {
                type: "submit",
                disabled: !(ui.msg || "").trim(),
                className: "p-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl transition disabled:opacity-50"
              }, "➤")
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(App));
  </script>
</body>
</html>
