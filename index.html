<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Live Collab E-Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    body { background-color: #111827; margin: 0; overflow: hidden; touch-action: none; }
    canvas { touch-action: none; cursor: crosshair; }
    .glass-panel { background: rgba(31, 41, 55, 0.85); backdrop-filter: blur(10px); }
    .text-input-overlay {
      position: absolute;
      background: rgba(17, 24, 39, 0.6);
      border: 1px dashed #10b981;
      color: white;
      outline: none;
      padding: 4px 8px;
      font-family: sans-serif;
      z-index: 60;
      white-space: nowrap;
      border-radius: 10px;
    }
    .room-card:hover { transform: translateY(-2px); }
    #debug-console {
      position: fixed;
      bottom: 10px;
      right: 10px;
      max-width: 350px;
      max-height: 250px;
      overflow-y: auto;
      background: rgba(0,0,0,0.95);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #0f0;
      z-index: 9999;
    }
    #debug-console .error { color: #f00; }
    #debug-console .success { color: #0f0; }
    #debug-console .warning { color: #ff0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="debug-console"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collection, doc,
      setDoc, addDoc,
      onSnapshot,
      serverTimestamp,
      query, orderBy, limit,
      getDoc,
      writeBatch,
      runTransaction,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const h = React.createElement;
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // 디버그 로그
    const debugLog = (msg, type = 'info') => {
      const timestamp = new Date().toLocaleTimeString();
      console.log(`[E-Board ${timestamp}]`, msg);
      
      const el = document.getElementById('debug-console');
      if (el) {
        const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
        el.innerHTML += `<div class="${className}">${timestamp}: ${msg}</div>`;
        el.scrollTop = el.scrollHeight;
      }
    };

    // ✅ 여러분의 실제 Firebase 프로젝트 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDK2VURk2eqaRy52yi2sPZuwYVb2ymmR3I",
      authDomain: "eboard-7849c.firebaseapp.com",
      projectId: "eboard-7849c",
      storageBucket: "eboard-7849c.firebasestorage.app",
      messagingSenderId: "458693602522",
      appId: "1:458693602522:web:4a546e6c565368e283e25d"
    };

    debugLog('✓ Firebase Config 로드됨', 'success');

    let app, auth, db;
    
    try {
      debugLog('Firebase 초기화 시작...');
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      debugLog('✓ Firebase 초기화 완료', 'success');
    } catch (e) {
      debugLog(`❌ Firebase 초기화 실패: ${e.message}`, 'error');
      alert(`Firebase 초기화 실패!\n\n${e.message}`);
    }

    const LOBBY_ID = "eboard-lobby-v1";
    const nowISO = () => new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

    function useInterval(fn, ms) {
      const fnRef = useRef(fn);
      useEffect(() => { fnRef.current = fn; }, [fn]);
      useEffect(() => {
        if (!ms) return;
        const id = setInterval(() => fnRef.current(), ms);
        return () => clearInterval(id);
      }, [ms]);
    }

    const IconBtn = ({ title, onClick, active, disabled, children, className }) => (
      h("button", {
        title, onClick, disabled,
        className:
          (className || "") +
          " p-2 rounded-lg transition select-none " +
          (disabled ? " opacity-40 cursor-not-allowed " : " hover:bg-gray-800 ") +
          (active ? " bg-emerald-500/20 text-emerald-400 " : " text-gray-300 ")
      }, children)
    );

    function App() {
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [roomInfo, setRoomInfo] = useState({
        id: "",
        nickname: localStorage.getItem("eboard_nick") || ""
      });

      const [activeRooms, setActiveRooms] = useState([]);
      const [currentPage, setCurrentPage] = useState(1);

      const [data, setData] = useState({
        strokes: [],
        texts: [],
        messages: [],
        users: []
      });

      const [ui, setUi] = useState({
        color: "#10b981",
        width: 4,
        showChat: true,
        msg: "",
        tool: "text",
        showUsers: false
      });

      const [textInput, setTextInput] = useState({
        active: false,
        x: 0, y: 0,
        rawX: 0, rawY: 0,
        value: ""
      });

      const [ownerUid, setOwnerUid] = useState(null);
      const isOwner = useMemo(() => !!(user && ownerUid && user.uid === ownerUid), [user, ownerUid]);

      const canText = true;
      const canDraw = isOwner;

      const canvasRef = useRef(null);
      const textRef = useRef(null);
      const drawingRef = useRef({ isDrawing: false, points: [] });

      // Auth 초기화
      useEffect(() => {
        if (!auth) return;
        
        debugLog('Auth 초기화 시작...');
        
        const doAuth = async () => {
          try {
            const result = await signInAnonymously(auth);
            debugLog(`✓ 익명 로그인 성공: ${result.user.uid.slice(0, 8)}...`, 'success');
          } catch (e) {
            debugLog(`❌ Auth 실패: ${e.message}`, 'error');
            console.error("Auth error:", e);
          }
        };

        doAuth();

        const unsub = onAuthStateChanged(auth, (u) => {
          if (u) {
            debugLog(`✓ 사용자 인증됨: ${u.uid.slice(0, 8)}...`, 'success');
            setUser(u);
            setAuthReady(true);
          } else {
            debugLog('⚠ 사용자 없음', 'warning');
            setUser(null);
            setAuthReady(false);
          }
        });

        return () => unsub();
      }, []);

      // Lobby 리스너
      useEffect(() => {
        if (!authReady || !db) return;
        
        debugLog('Lobby 리스너 시작...');
        
        try {
          const qLobby = query(
            collection(db, "artifacts", LOBBY_ID, "public", "data", "active_rooms"),
            orderBy("lastActivity", "desc"),
            limit(50)
          );

          const unsubLobby = onSnapshot(
            qLobby,
            (snap) => {
              debugLog(`✓ Lobby 데이터 수신: ${snap.docs.length}개`, 'success');
              const cutoff = Date.now() - 24 * 60 * 60 * 1000;
              
              const rooms = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(r => {
                  const status = r.status || "active";
                  const lastAct = r.lastActivity?.toMillis?.() || 0;
                  return status === "active" && lastAct >= cutoff;
                });

              debugLog(`✓ 활성 방: ${rooms.length}개`, 'success');
              setActiveRooms(rooms);
            },
            (err) => {
              debugLog(`❌ Lobby 에러: ${err.message}`, 'error');
              console.error("Lobby error:", err);
            }
          );

          return () => unsubLobby();
        } catch (e) {
          debugLog(`❌ Lobby 리스너 생성 실패: ${e.message}`, 'error');
        }
      }, [authReady]);

      const ensureRoomMetaOwner = useCallback(async (roomId, currentUid) => {
        if (!db) return;
        
        debugLog(`Room Meta 확인: ${roomId}`);
        
        try {
          const metaRef = doc(db, "artifacts", roomId, "public", "data", "room_meta", "meta");
          await runTransaction(db, async (tx) => {
            const snap = await tx.get(metaRef);
            if (!snap.exists()) {
              debugLog(`✓ 방장 설정: ${currentUid.slice(0, 8)}...`, 'success');
              tx.set(metaRef, {
                ownerUid: currentUid,
                status: "active",
                createdAt: serverTimestamp()
              }, { merge: true });
            }
          });
        } catch (e) {
          debugLog(`❌ Meta 생성 실패: ${e.message}`, 'error');
          console.error('ensureRoomMetaOwner error:', e);
        }
      }, []);

      useEffect(() => {
        if (!isLoggedIn || !roomInfo.id || !db) return;

        debugLog(`Meta 구독: ${roomInfo.id}`);
        
        const metaRef = doc(db, "artifacts", roomInfo.id, "public", "data", "room_meta", "meta");
        const unsub = onSnapshot(
          metaRef,
          (snap) => {
            if (snap.exists()) {
              const owner = snap.data().ownerUid || null;
              debugLog(`✓ 방장: ${owner?.slice(0, 8)}...`, 'success');
              setOwnerUid(owner);
            } else {
              setOwnerUid(null);
            }
          },
          (err) => debugLog(`❌ Meta 에러: ${err.message}`, 'error')
        );

        return () => unsub();
      }, [isLoggedIn, roomInfo.id]);

      useEffect(() => {
        if (!user || !isLoggedIn || !roomInfo.id || !db) return;

        debugLog(`✓ Room 동기화 시작: ${roomInfo.id}`, 'success');
        
        const base = ["artifacts", roomInfo.id, "public", "data"];
        const sortByTime = (arr) => {
          const copy = [...arr];
          copy.sort((a, b) => (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0));
          return copy;
        };

        const unsubStrokes = onSnapshot(
          collection(db, ...base, "strokes"),
          (s) => {
            const count = s.docs.length;
            if (count > 0) debugLog(`✓ Strokes: ${count}개`, 'success');
            setData(p => ({ ...p, strokes: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) }));
          },
          (err) => debugLog(`❌ Strokes: ${err.message}`, 'error')
        );

        const unsubTexts = onSnapshot(
          collection(db, ...base, "texts"),
          (s) => {
            const count = s.docs.length;
            if (count > 0) debugLog(`✓ Texts: ${count}개`, 'success');
            setData(p => ({ ...p, texts: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) }));
          },
          (err) => debugLog(`❌ Texts: ${err.message}`, 'error')
        );

        const unsubMessages = onSnapshot(
          collection(db, ...base, "messages"),
          (s) => setData(p => ({ ...p, messages: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) })),
          (err) => debugLog(`❌ Messages: ${err.message}`, 'error')
        );

        const unsubUsers = onSnapshot(
          collection(db, ...base, "users"),
          (s) => {
            const count = s.docs.length;
            debugLog(`✓ 접속자: ${count}명`, 'success');
            setData(p => ({ ...p, users: s.docs.map(d => ({ id: d.id, ...d.data() })) }));
          },
          (err) => debugLog(`❌ Users: ${err.message}`, 'error')
        );

        setDoc(doc(db, ...base, "users", user.uid), {
          uid: user.uid,
          name: roomInfo.nickname,
          lastSeen: serverTimestamp()
        }, { merge: true }).catch(e => debugLog(`❌ User 등록: ${e.message}`, 'error'));

        setDoc(
          doc(db, "artifacts", LOBBY_ID, "public", "data", "active_rooms", roomInfo.id),
          { roomId: roomInfo.id, status: "active", lastActivity: serverTimestamp() },
          { merge: true }
        ).catch(e => debugLog(`❌ Lobby 갱신: ${e.message}`, 'error'));

        return () => {
          unsubStrokes();
          unsubTexts();
          unsubMessages();
          unsubUsers();
        };
      }, [user, isLoggedIn, roomInfo.id, roomInfo.nickname]);

      useInterval(async () => {
        if (!user || !isLoggedIn || !roomInfo.id || !db) return;
        
        try {
          await setDoc(
            doc(db, "artifacts", roomInfo.id, "public", "data", "users", user.uid),
            { lastSeen: serverTimestamp() },
            { merge: true }
          );

          await setDoc(
            doc(db, "artifacts", LOBBY_ID, "public", "data", "active_rooms", roomInfo.id),
            { lastActivity: serverTimestamp(), status: "active" },
            { merge: true }
          );
        } catch (e) {
          debugLog(`❌ Heartbeat: ${e.message}`, 'error');
        }
      }, isLoggedIn ? 15000 : null);

      const redraw = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;

        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const wCSS = canvas.clientWidth;
        const hCSS = canvas.clientHeight;
        if (!wCSS || !hCSS) return;

        canvas.width = Math.floor(wCSS * dpr);
        canvas.height = Math.floor(hCSS * dpr);

        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, wCSS, hCSS);

        data.strokes
          .filter(s => (s.page || 1) === currentPage)
          .forEach(s => {
            if (!s.points || s.points.length < 2) return;
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = s.color || "#10b981";
            ctx.lineWidth = s.width || 4;

            ctx.moveTo(s.points[0].x * wCSS, s.points[0].y * hCSS);
            for (let i = 1; i < s.points.length; i++) {
              ctx.lineTo(s.points[i].x * wCSS, s.points[i].y * hCSS);
            }
            ctx.stroke();
          });

        data.texts
          .filter(t => (t.page || 1) === currentPage)
          .forEach(t => {
            ctx.fillStyle = t.color || "#ffffff";
            const px = Math.max(14, (t.fontSize || 18));
            ctx.font = `${px}px sans-serif`;
            ctx.fillText(t.text || "", (t.x || 0) * wCSS, (t.y || 0) * hCSS);
          });
      }, [data.strokes, data.texts, currentPage]);

      useEffect(() => {
        const onResize = () => redraw();
        window.addEventListener("resize", onResize);
        setTimeout(() => redraw(), 0);
        return () => window.removeEventListener("resize", onResize);
      }, [redraw]);

      useEffect(() => { redraw(); }, [redraw]);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0];
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;
        const x = (clientX - rect.left) / rect.width;
        const y = (clientY - rect.top) / rect.height;
        return {
          x: Math.max(0, Math.min(1, x)),
          y: Math.max(0, Math.min(1, y)),
          rawX: clientX - rect.left,
          rawY: clientY - rect.top
        };
      };

      const drawStart = (e) => {
        if (!isLoggedIn) return;
        const pos = getPos(e);

        if (ui.tool === "text") {
          if (!canText) return;
          setTextInput({
            active: true,
            x: pos.x, y: pos.y,
            rawX: pos.rawX, rawY: pos.rawY,
            value: ""
          });
          return;
        }

        if (!canDraw) return;
        drawingRef.current.isDrawing = true;
        drawingRef.current.points = [{ x: pos.x, y: pos.y }];
      };

      const drawMove = (e) => {
        if (!drawingRef.current.isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const pos = getPos(e);
        const pts = drawingRef.current.points;
        pts.push({ x: pos.x, y: pos.y });

        const wCSS = canvas.clientWidth;
        const hCSS = canvas.clientHeight;

        const last = pts[pts.length - 2];
        ctx.beginPath();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = ui.color;
        ctx.lineWidth = ui.width;
        ctx.moveTo(last.x * wCSS, last.y * hCSS);
        ctx.lineTo(pos.x * wCSS, pos.y * hCSS);
        ctx.stroke();
      };

      const drawEnd = async () => {
        if (!drawingRef.current.isDrawing || !db) return;
        drawingRef.current.isDrawing = false;

        const pts = drawingRef.current.points;
        if (!pts || pts.length < 2) return;

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "strokes"),
            {
              points: pts,
              color: ui.color,
              width: ui.width,
              page: currentPage,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );
          debugLog('✓ 스트로크 저장', 'success');
        } catch (e) {
          debugLog(`❌ 스트로크 저장 실패: ${e.message}`, 'error');
          alert(`그리기 실패!\n\n${e.message}\n\nFirestore 보안 규칙을 확인하세요.`);
        }
      };

      const submitText = async () => {
        const v = (textInput.value || "").trim();
        setTextInput(p => ({ ...p, active: false }));

        if (!v || !canText || !db) return;

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "texts"),
            {
              text: v,
              x: textInput.x,
              y: textInput.y,
              color: ui.color,
              fontSize: Math.max(16, ui.width * 4),
              page: currentPage,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );
          debugLog('✓ 텍스트 저장', 'success');
        } catch (e) {
          debugLog(`❌ 텍스트 저장 실패: ${e.message}`, 'error');
          alert(`텍스트 저장 실패!\n\n${e.message}\n\nFirestore 보안 규칙을 확인하세요.`);
        }
      };

      const exportBoardAsImage = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        redraw();
        const url = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = `board_${roomInfo.id}_p${currentPage}_${nowISO()}.png`;
        a.click();
        debugLog('✓ 이미지 저장', 'success');
      };

      const endRoom = async () => {
        if (!isOwner || !db) return;
        const ok = confirm("회의를 종료할까요?");
        if (!ok) return;

        try {
          const batch = writeBatch(db);
          batch.set(
            doc(db, "artifacts", LOBBY_ID, "public", "data", "active_rooms", roomInfo.id),
            { status: "closed", endedAt: serverTimestamp() },
            { merge: true }
          );
          batch.set(
            doc(db, "artifacts", roomInfo.id, "public", "data", "room_meta", "meta"),
            { status: "closed", endedAt: serverTimestamp() },
            { merge: true }
          );
          await batch.commit();
          
          debugLog('✓ 회의 종료', 'success');
          alert("회의가 종료되었습니다.");
          window.location.reload();
        } catch (e) {
          debugLog(`❌ 종료 실패: ${e.message}`, 'error');
        }
      };

      const generateNewRoomId = () => {
        const randomId = "Room-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        setRoomInfo(p => ({ ...p, id: randomId }));
        debugLog(`✓ 방 생성: ${randomId}`, 'success');
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const nick = (roomInfo.nickname || "").trim();
        const rid = (roomInfo.id || "").trim();
        
        if (!nick || !rid) {
          alert("닉네임과 방 이름을 입력하세요!");
          return;
        }

        if (!user || !db) {
          alert("인증 대기 중...");
          return;
        }

        debugLog(`로그인 시도: ${rid}`);
        localStorage.setItem("eboard_nick", nick);

        try {
          const lobbyRef = doc(db, "artifacts", LOBBY_ID, "public", "data", "active_rooms", rid);
          const snap = await getDoc(lobbyRef);

          if (snap.exists() && snap.data().status === "closed") {
            alert("종료된 회의입니다.");
            return;
          }

          await setDoc(lobbyRef, {
            roomId: rid,
            status: "active",
            createdAt: serverTimestamp(),
            lastActivity: serverTimestamp()
          }, { merge: true });

          await ensureRoomMetaOwner(rid, user.uid);
          
          debugLog('✓ 로그인 성공!', 'success');
          setIsLoggedIn(true);
        } catch (e) {
          debugLog(`❌ 로그인 실패: ${e.message}`, 'error');
          alert(`입장 실패!\n\n${e.message}\n\n보안 규칙 확인 필요`);
        }
      };

      const sendChat = async (e) => {
        e.preventDefault();
        const v = (ui.msg || "").trim();
        if (!v || !db) return;

        setUi(p => ({ ...p, msg: "" }));

        try {
          await addDoc(
            collection(db, "artifacts", roomInfo.id, "public", "data", "messages"),
            {
              text: v,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            }
          );
        } catch (e2) {
          debugLog(`❌ 채팅 실패: ${e2.message}`, 'error');
        }
      };

      // 로그인 화면
      if (!isLoggedIn) {
        return h("div", { className: "h-screen w-full flex items-center justify-center bg-gray-900 p-6 overflow-y-auto" },
          h("div", { className: "max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start" },

            h("div", { className: "bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6" },
              h("div", null,
                h("h1", { className: "text-3xl font-black text-white bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 uppercase tracking-tighter" }, "E-Board Collab"),
                h("p", { className: "text-gray-400 text-sm mt-1" }, "실시간 협업 칠판"),
                !authReady ? h("p", { className: "text-yellow-400 text-xs mt-2 animate-pulse" }, "⏳ 인증 준비 중...") : 
                             h("p", { className: "text-emerald-400 text-xs mt-2" }, "✓ 준비 완료")
              ),

              h("form", { onSubmit: handleLogin, className: "space-y-4" },
                h("div", { className: "space-y-4" },
                  h("div", null,
                    h("label", { className: "text-[10px] text-gray-500 mb-1 block uppercase font-bold tracking-widest" }, "닉네임"),
                    h("input", {
                      type: "text",
                      value: roomInfo.nickname,
                      onChange: (e) => setRoomInfo(p => ({ ...p, nickname: e.target.value })),
                      className: "w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition",
                      placeholder: "이름 입력",
                      required: true
                    })
                  ),

                  h("div", { className: "pt-2" },
                    h("div", { className: "flex justify-between items-end mb-1" },
                      h("label", { className: "text-[10px] text-gray-500 uppercase font-bold tracking-widest" }, "방 이름"),
                      h("button", {
                        type: "button",
                        onClick: generateNewRoomId,
                        className: "text-[10px] text-emerald-400 font-bold hover:underline"
                      }, "+ 새 회의")
                    ),
                    h("input", {
                      type: "text",
                      value: roomInfo.id,
                      onChange: (e) => setRoomInfo(p => ({ ...p, id: e.target.value })),
                      className: "w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition",
                      placeholder: "예: MEETING-01",
                      required: true
                    })
                  )
                ),

                h("button", {
                  type: "submit",
                  disabled: !authReady,
                  className: "w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl transition shadow-lg uppercase tracking-widest mt-4"
                }, authReady ? "입장하기" : "준비 중...")
              )
            ),

            h("div", { className: "space-y-4" },
              h("div", { className: "flex items-center justify-between px-2" },
                h("h2", { className: "text-xs font-bold text-gray-400 uppercase tracking-widest" }, "활성 회의실"),
                h("span", { className: "text-[10px] bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full border border-gray-700" }, activeRooms.length)
              ),

              h("div", { className: "space-y-2 max-h-[520px] overflow-y-auto pr-2" },
                activeRooms.length === 0
                  ? h("div", { className: "p-12 border-2 border-dashed border-gray-800 rounded-3xl text-center" },
                      h("div", { className: "text-gray-600 text-sm" }, "진행 중인 회의가 없습니다")
                    )
                  : activeRooms.map(room =>
                      h("button", {
                        key: room.id,
                        onClick: () => setRoomInfo(p => ({ ...p, id: room.id })),
                        className: "w-full room-card bg-gray-800/40 hover:bg-gray-800 border border-gray-700/50 hover:border-emerald-500/50 p-5 rounded-2xl flex justify-between items-center transition text-left"
                      },
                        h("div", null,
                          h("div", { className: "text-emerald-400 font-black text-xl" }, room.id),
                          h("div", { className: "text-[10px] text-gray-500" },
                            room.lastActivity?.toMillis
                              ? new Date(room.lastActivity.toMillis()).toLocaleString()
                              : "방금 전"
                          )
                        ),
                        h("div", { className: "text-emerald-500" }, "→")
                      )
                    )
              )
            )
          )
        );
      }

      // 보드 UI
      const onlineCount = data.users.length;

      return h("div", { className: "h-screen w-full flex flex-col bg-gray-950 text-white overflow-hidden" },

        h("header", { className: "h-14 glass-panel border-b border-gray-800 flex items-center justify-between px-6 z-20 relative" },
          h("div", { className: "flex items-center gap-4" },
            h("span", { className: "font-black text-lg text-emerald-400" }, "BOARD"),
            h("div", { className: "h-6 w-px bg-gray-800" }),
            h("div", { className: "flex items-center gap-2 text-[10px] font-mono text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800" },
              h("span", { className: "text-white" }, roomInfo.id),
              h("span", { className: "text-emerald-500 font-bold" }, `● ${onlineCount}`),
              isOwner ? h("span", { className: "ml-2 text-emerald-300" }, "(방장)") : h("span", { className: "ml-2 text-gray-400" }, "(참석자)")
            )
          ),

          h("div", { className: "flex items-center gap-2" },
            IconBtn({ title: "참석자", onClick: () => setUi(p => ({ ...p, showUsers: !p.showUsers })), active: ui.showUsers }, "👥"),
            h("div", { className: "h-6 w-px bg-gray-800" }),
            IconBtn({ title: "이전", onClick: () => setCurrentPage(p => Math.max(1, p - 1)), disabled: currentPage === 1 }, "◀"),
            h("span", { className: "text-xs font-mono px-2" }, `P.${currentPage}`),
            IconBtn({ title: "다음", onClick: () => setCurrentPage(p => p + 1) }, "▶"),
            h("div", { className: "h-6 w-px bg-gray-800" }),
            IconBtn({ title: "채팅", onClick: () => setUi(p => ({ ...p, showChat: !p.showChat })), active: ui.showChat }, "💬"),
            IconBtn({ title: "저장", onClick: exportBoardAsImage }, "🖼️"),
            isOwner ? IconBtn({ title: "종료", onClick: endRoom, className: "!text-red-300 hover:!bg-red-500/20" }, "END") : null,
            h("button", {
              onClick: () => { if (confirm("나가시겠습니까?")) window.location.reload(); },
              className: "p-2 text-xs text-gray-500 hover:text-white transition"
            }, "EXIT")
          ),

          ui.showUsers ? h("div", { className: "absolute top-14 left-6 w-72 glass-panel border border-gray-800 rounded-2xl p-3 z-30" },
            h("div", { className: "text-xs text-gray-300 font-bold mb-2" }, "참석자"),
            h("div", { className: "space-y-2 max-h-64 overflow-auto" },
              data.users.map(u => h("div", {
                key: u.id,
                className: "flex items-center justify-between bg-gray-900/40 border border-gray-800 rounded-xl px-3 py-2"
              },
                h("div", null,
                  h("div", { className: "text-sm text-white" },
                    u.name || "Unknown",
                    (u.uid === ownerUid) ? h("span", { className: "ml-2 text-[10px] text-emerald-400" }, "(방장)") : null
                  )
                )
              ))
            )
          ) : null
        ),

        h("div", { className: "flex-1 flex relative" },

          h("div", { className: "flex-1 relative overflow-hidden" },
            h("canvas", {
              ref: canvasRef,
              className: "block w-full h-full",
              onMouseDown: (e) => { e.preventDefault(); drawStart(e); },
              onMouseMove: (e) => { e.preventDefault(); drawMove(e); },
              onMouseUp: (e) => { e.preventDefault(); drawEnd(); },
              onMouseLeave: (e) => { e.preventDefault(); drawEnd(); },
              onTouchStart: (e) => { e.preventDefault(); drawStart(e); },
              onTouchMove: (e) => { e.preventDefault(); drawMove(e); },
              onTouchEnd: (e) => { e.preventDefault(); drawEnd(); }
            }),

            textInput.active ? h("input", {
              ref: textRef,
              type: "text",
              className: "text-input-overlay",
              style: {
                left: `${textInput.rawX}px`,
                top: `${Math.max(0, textInput.rawY - (ui.width * 2))}px`,
                color: ui.color,
                fontSize: `${Math.max(16, ui.width * 4)}px`
              },
              value: textInput.value,
              onChange: (e) => setTextInput(p => ({ ...p, value: e.target.value })),
              onBlur: submitText,
              onKeyDown: (e) => { if (e.key === "Enter") submitText(); },
              autoFocus: true
            }) : null,

            h("div", { className: "absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel border border-gray-700 px-6 py-3 rounded-3xl flex items-center gap-6" },
              h("div", { className: "flex gap-2 p-1 bg-gray-900/50 rounded-xl" },
                h("button", {
                  onClick: () => setUi(p => ({ ...p, tool: "text" })),
                  className: "p-2 rounded-lg transition " + (ui.tool === "text" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white")
                }, "T"),
                h("button", {
                  onClick: () => setUi(p => ({ ...p, tool: "pencil" })),
                  disabled: !canDraw,
                  className: "p-2 rounded-lg transition " + (ui.tool === "pencil" ? "bg-emerald-500 text-white" : "text-gray-400") + (!canDraw ? " opacity-40 cursor-not-allowed" : "")
                }, "✏️")
              ),

              h("div", { className: "flex gap-3" },
                ["#10b981", "#ef4444", "#3b82f6", "#ffffff"].map(c =>
                  h("button", {
                    key: c,
                    onClick: () => setUi(p => ({ ...p, color: c })),
                    className: "w-6 h-6 rounded-full border-2 transition " + (ui.color === c ? "border-white scale-110" : "border-transparent opacity-60"),
                    style: { backgroundColor: c }
                  })
                )
              ),

              h("div", { className: "flex items-center gap-2" },
                h("span", { className: "text-[10px] text-gray-400" }, "W"),
                h("input", {
                  type: "range",
                  min: 2, max: 12,
                  value: ui.width,
                  onChange: (e) => setUi(p => ({ ...p, width: parseInt(e.target.value) }))
                })
              )
            )
          ),

          h("div", {
            className: "transition-all duration-300 " + (ui.showChat ? "w-80 border-l border-gray-800" : "w-0 overflow-hidden") + " flex flex-col glass-panel"
          },
            h("div", { className: "flex-1 overflow-y-auto p-4 space-y-4" },
              data.messages.map((m, i) =>
                h("div", {
                  key: m.id || i,
                  className: "flex flex-col " + (m.userId === user?.uid ? "items-end" : "items-start")
                },
                  h("span", { className: "text-[10px] text-gray-500 mb-1" }, m.userName),
                  h("div", {
                    className: "max-w-[90%] px-3 py-2 text-sm rounded-2xl " + (m.userId === user?.uid ? "bg-emerald-600 text-white" : "bg-gray-800 text-gray-200")
                  }, m.text)
                )
              )
            ),

            h("form", { onSubmit: sendChat, className: "p-4 bg-gray-900 border-t border-gray-800 flex gap-2" },
              h("input", {
                type: "text",
                value: ui.msg,
                onChange: (e) => setUi(p => ({ ...p, msg: e.target.value })),
                placeholder: "채팅...",
                className: "flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500"
              }),
              h("button", {
                type: "submit",
                disabled: !ui.msg.trim(),
                className: "p-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl transition disabled:opacity-50"
              }, "➤")
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(App));
  </script>
</body>
</html>
