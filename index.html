<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Collab E-Board</title>

  <!-- Tailwind CSS (dev) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (compat / UMD) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    body { background-color: #111827; margin: 0; overflow: hidden; }
    canvas { cursor: crosshair; }

    .glass-panel { background: rgba(31, 41, 55, 0.85); backdrop-filter: blur(10px); }

    .text-input-overlay {
      position: absolute;
      background: rgba(0,0,0,0.15);
      border: 1px dashed #10b981;
      color: white;
      outline: none;
      padding: 6px 8px;
      font-family: sans-serif;
      z-index: 50;
      border-radius: 10px;
      touch-action: auto;
      pointer-events: auto;
      min-width: 160px;
    }

    .room-card:hover { transform: translateY(-2px); }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyDK2VURk2eqaRy52yi2sPZuwYVb2ymmR3I",
      authDomain: "eboard-95055.firebaseapp.com",
      databaseURL: "https://eboard-95055-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "eboard-95055",
      storageBucket: "eboard-95055.firebasestorage.app",
      messagingSenderId: "927523134440",
      appId: "1:927523134440:web:4a546e6c565368e283e25d",
      measurementId: "G-BCPK0YX0E3"
    };

    const globalAppId = typeof __app_id !== "undefined" ? __app_id : "vibe-board-lobby";

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();

    const col = (...segs) => db.collection(segs.join("/"));
    const docRef = (...segs) => db.doc(segs.join("/"));

    const Icons = {
      Pencil: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
      ),
      Text: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M12 6v14m-5 0h10" />
        </svg>
      ),
      Select: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M3 3l7.5 18 2-7.5L20 11 3 3z" />
        </svg>
      ),
      Trash: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Users: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      Send: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      ),
      Undo: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
        </svg>
      ),
      Plus: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
        </svg>
      )
    };

    const clamp01 = (v) => Math.min(1, Math.max(0, v));

    const App = () => {
      const [user, setUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [roomInfo, setRoomInfo] = useState({
        id: "",
        nickname: localStorage.getItem("eboard_nick") || ""
      });

      const [activeRooms, setActiveRooms] = useState([]);
      const [currentPage, setCurrentPage] = useState(1);
      const [data, setData] = useState({ strokes: [], texts: [], messages: [], users: [] });

      // ui.tool: 'pencil' | 'text' | 'select'
      const [ui, setUi] = useState({ color: "#10b981", width: 4, showChat: true, msg: "", tool: "pencil" });

      // text input overlay
      const [textInput, setTextInput] = useState({
        active: false,
        x: 0, y: 0, rawX: 0, rawY: 0,
        value: "",
        mode: "create",     // 'create' | 'edit'
        targetId: null
      });

      // selected sets (arrays)
      const [selection, setSelection] = useState({ texts: [], strokes: [] });

      // selection box (marquee)
      const [selectBox, setSelectBox] = useState({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });

      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const textRef = useRef(null);

      // states for gesture
      const drawing = useRef({ isDrawing: false, points: [] });
      const draggingText = useRef({ active: false, id: null, offsetX: 0, offsetY: 0 });
      const dragGhost = useRef({ active: false, id: null, x: null, y: null });

      const marquee = useRef({ down: false, startX: 0, startY: 0, started: false });
      const downPosPx = useRef({ x: 0, y: 0 }); // for threshold

      // prevent double submit (Enter + blur)
      const submittingText = useRef(false);

      // text bounds for hit test / selection
      const textBoundsRef = useRef(new Map()); // id -> {x1,y1,x2,y2,page}

      // --- Auth & Lobby ---
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (err) {
            console.error("Auth failed:", err);
          }
        };
        initAuth();

        const unsubAuth = auth.onAuthStateChanged((u) => setUser(u));

        const unsubLobby = col("artifacts", globalAppId, "public", "data", "active_rooms")
          .onSnapshot((s) => {
            const rooms = s.docs.map((d) => ({ id: d.id, ...d.data() }));
            rooms.sort((a, b) => (b.lastActivity?.toMillis?.() || 0) - (a.lastActivity?.toMillis?.() || 0));
            setActiveRooms(rooms);
          }, (err) => console.error("Lobby onSnapshot error:", err));

        return () => { unsubAuth(); unsubLobby(); };
      }, []);

      // --- Room Sync ---
      useEffect(() => {
        if (!user || !isLoggedIn || !roomInfo.id) return;

        const base = ["artifacts", roomInfo.id, "public", "data"];
        const sortByTime = (docs) =>
          [...docs].sort((a, b) => (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0));

        const unsubStrokes = col(...base, "strokes").onSnapshot((s) => {
          setData((p) => ({ ...p, strokes: sortByTime(s.docs.map((d) => ({ id: d.id, ...d.data() }))) }));
        }, (err) => console.error("strokes snapshot error:", err));

        const unsubTexts = col(...base, "texts").onSnapshot((s) => {
          setData((p) => ({ ...p, texts: sortByTime(s.docs.map((d) => ({ id: d.id, ...d.data() }))) }));
        }, (err) => console.error("texts snapshot error:", err));

        const unsubMessages = col(...base, "messages").onSnapshot((s) => {
          setData((p) => ({ ...p, messages: sortByTime(s.docs.map((d) => ({ id: d.id, ...d.data() }))) }));
        }, (err) => console.error("messages snapshot error:", err));

        const unsubUsers = col(...base, "users").onSnapshot((s) => {
          setData((p) => ({ ...p, users: s.docs.map((d) => ({ id: d.id, ...d.data() })) }));
        }, (err) => console.error("users snapshot error:", err));

        docRef(...base, "users", user.uid).set({
          name: roomInfo.nickname,
          uid: user.uid,
          lastSeen: serverTimestamp()
        }, { merge: true });

        docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set({
          lastActivity: serverTimestamp(),
          activeUserCount: (data.users?.length || 0) + 1
        }, { merge: true });

        return () => { unsubStrokes(); unsubTexts(); unsubMessages(); unsubUsers(); };
      }, [user, isLoggedIn, roomInfo.id]);

      // --- helpers ---
      const getCanvasWH = () => {
        const canvas = canvasRef.current;
        const dpr = window.devicePixelRatio || 1;
        return { w: canvas.width / dpr, h: canvas.height / dpr };
      };

      const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const clientX = e.clientX;
        const clientY = e.clientY;
        return {
          x: clamp01((clientX - rect.left) / rect.width),
          y: clamp01((clientY - rect.top) / rect.height),
          rawX: clientX - rect.left,
          rawY: clientY - rect.top
        };
      };

      const normRect = (x1, y1, x2, y2) => {
        const left = Math.min(x1, x2);
        const right = Math.max(x1, x2);
        const top = Math.min(y1, y2);
        const bottom = Math.max(y1, y2);
        return { left, right, top, bottom };
      };

      const rectIntersects = (a, b) =>
        !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);

      const hitTestText = (nx, ny) => {
        const candidates = [...data.texts].filter(t => (t.page || 1) === currentPage);
        for (let i = candidates.length - 1; i >= 0; i--) {
          const t = candidates[i];
          const b = textBoundsRef.current.get(t.id);
          if (!b) continue;
          if ((b.page || 1) !== currentPage) continue;
          if (nx >= b.x1 && nx <= b.x2 && ny >= b.y1 && ny <= b.y2) return t;
        }
        return null;
      };

      const computeSelectionFromBox = (box) => {
        const r = normRect(box.x1, box.y1, box.x2, box.y2);

        // texts: bounds intersects
        const selectedTexts = [];
        for (const t of data.texts) {
          if ((t.page || 1) !== currentPage) continue;
          const b = textBoundsRef.current.get(t.id);
          if (!b) continue;
          const tb = { left: b.x1, right: b.x2, top: b.y1, bottom: b.y2 };
          if (rectIntersects(r, tb)) selectedTexts.push(t.id);
        }

        // strokes: any point inside box
        const selectedStrokes = [];
        for (const s of data.strokes) {
          if ((s.page || 1) !== currentPage) continue;
          const pts = s.points || [];
          let inside = false;
          for (const p of pts) {
            if (p.x >= r.left && p.x <= r.right && p.y >= r.top && p.y <= r.bottom) { inside = true; break; }
          }
          if (inside) selectedStrokes.push(s.id);
        }

        return { texts: selectedTexts, strokes: selectedStrokes };
      };

      // --- Canvas redraw (텍스트 hitbox도 같이 계산) ---
      const redraw = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

        const { w, h } = getCanvasWH();

        // strokes
        data.strokes
          .filter((s) => (s.page || 1) === currentPage)
          .forEach((s) => {
            if (!s.points || s.points.length < 2) return;
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = s.color || "#10b981";
            ctx.lineWidth = s.width || 3;
            ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
            s.points.slice(1).forEach((p) => ctx.lineTo(p.x * w, p.y * h));
            ctx.stroke();

            // selected stroke outline (가벼운 강조)
            if (selection.strokes.includes(s.id)) {
              ctx.save();
              ctx.globalAlpha = 0.5;
              ctx.lineWidth = (s.width || 3) + 4;
              ctx.strokeStyle = "#10b981";
              ctx.beginPath();
              ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
              s.points.slice(1).forEach((p) => ctx.lineTo(p.x * w, p.y * h));
              ctx.stroke();
              ctx.restore();
            }
          });

        // texts + bounds
        const boundsMap = textBoundsRef.current;

        data.texts
          .filter((t) => (t.page || 1) === currentPage)
          .forEach((t) => {
            const drawX = (dragGhost.current.active && dragGhost.current.id === t.id && dragGhost.current.x != null)
              ? dragGhost.current.x
              : t.x;
            const drawY = (dragGhost.current.active && dragGhost.current.id === t.id && dragGhost.current.y != null)
              ? dragGhost.current.y
              : t.y;

            const px = drawX * w;
            const py = drawY * h;

            const fontPx = Math.max(16, (t.fontSize || 16) * 2);
            ctx.fillStyle = t.color || "#ffffff";
            ctx.font = `${fontPx}px sans-serif`;
            ctx.textBaseline = "alphabetic";
            ctx.fillText(t.text || "", px, py);

            const metrics = ctx.measureText(t.text || "");
            const width = metrics.width || 0;
            const height = fontPx;

            const x1 = clamp01(px / w);
            const x2 = clamp01((px + width) / w);
            const y1 = clamp01((py - height) / h);
            const y2 = clamp01(py / h);

            boundsMap.set(t.id, { x1, y1, x2, y2, page: t.page || 1 });

            // selected text outline
            if (selection.texts.includes(t.id)) {
              ctx.save();
              ctx.strokeStyle = "#10b981";
              ctx.lineWidth = 2;
              ctx.setLineDash([6, 4]);
              ctx.strokeRect(px - 6, py - height - 6, width + 12, height + 12);
              ctx.restore();
            }
          });

        // marquee box
        if (selectBox.active) {
          const r = normRect(selectBox.x1, selectBox.y1, selectBox.x2, selectBox.y2);
          ctx.save();
          ctx.strokeStyle = "#10b981";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.strokeRect(r.left * w, r.top * h, (r.right - r.left) * w, (r.bottom - r.top) * h);
          ctx.fillStyle = "rgba(16,185,129,0.08)";
          ctx.fillRect(r.left * w, r.top * h, (r.right - r.left) * w, (r.bottom - r.top) * h);
          ctx.restore();
        }
      }, [data.strokes, data.texts, currentPage, selection.texts, selection.strokes, selectBox]);

      useEffect(() => { redraw(); }, [redraw]);

      // --- resize (scale 누적 방지) ---
      useEffect(() => {
        const resize = () => {
          if (!containerRef.current || !canvasRef.current) return;
          const { width, height } = containerRef.current.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;

          canvasRef.current.width = width * dpr;
          canvasRef.current.height = height * dpr;

          const ctx = canvasRef.current.getContext("2d");
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);

          canvasRef.current.style.width = `${width}px`;
          canvasRef.current.style.height = `${height}px`;

          redraw();
        };
        window.addEventListener("resize", resize);
        resize();
        return () => window.removeEventListener("resize", resize);
      }, [redraw]);

      // --- UX: tool 변경 시 커서/상태 정리 ---
      useEffect(() => {
        document.body.style.cursor =
          ui.tool === "select" ? "default" : (ui.tool === "text" ? "text" : "crosshair");

        // 텍스트 툴로 바꾸면 드래그 상태/선택 박스 정리
        if (ui.tool === "text") {
          draggingText.current = { active: false, id: null, offsetX: 0, offsetY: 0 };
          dragGhost.current = { active: false, id: null, x: null, y: null };
          marquee.current = { down: false, startX: 0, startY: 0, started: false };
          setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });
          setSelection({ texts: [], strokes: [] });
        }

        // 펜으로 바꾸면 선택 해제
        if (ui.tool === "pencil") {
          setSelection({ texts: [], strokes: [] });
          setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });
        }
      }, [ui.tool]);

      // --- 텍스트 저장(생성/수정) : ✅ 중복 submit 방지 + UI 먼저 닫기 ---
      const submitText = async (source = "unknown") => {
        if (submittingText.current) return;
        submittingText.current = true;

        const trimmed = (textInput.value || "").trim();
        const snapshot = { ...textInput };

        // ✅ UI 먼저 닫기(모바일/포인터 꼬임 방지)
        setTextInput({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: "", mode: "create", targetId: null });

        try {
          if (!trimmed) return;

          const payloadBase = {
            text: trimmed,
            x: snapshot.x,
            y: snapshot.y,
            color: ui.color,
            fontSize: ui.width * 2,
            page: currentPage,
            userId: user.uid,
            userName: roomInfo.nickname,
            updatedAt: serverTimestamp()
          };

          if (snapshot.mode === "edit" && snapshot.targetId) {
            await docRef("artifacts", roomInfo.id, "public", "data", "texts", snapshot.targetId).update(payloadBase);
            setSelection((p) => ({ ...p, texts: [snapshot.targetId], strokes: [] }));
          } else {
            const added = await col("artifacts", roomInfo.id, "public", "data", "texts").add({
              ...payloadBase,
              timestamp: serverTimestamp()
            });
            setSelection((p) => ({ ...p, texts: [added.id], strokes: [] }));
          }

          docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set(
            { lastActivity: serverTimestamp() },
            { merge: true }
          );
        } catch (err) {
          console.error("Text submit failed:", err);
        } finally {
          submittingText.current = false;
        }
      };

      // --- Pointer Handlers ---
      const onPointerDown = (e) => {
        if (!isLoggedIn) return;
        if (textInput.active) return;

        // pointer capture
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}

        const pos = getPos(e);
        downPosPx.current = { x: pos.rawX, y: pos.rawY };

        // 텍스트 추가 모드: 탭하면 입력창 생성
        if (ui.tool === "text") {
          setSelection({ texts: [], strokes: [] });
          setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });

          setTextInput({
            active: true,
            x: pos.x, y: pos.y,
            rawX: pos.rawX, rawY: pos.rawY,
            value: "",
            mode: "create",
            targetId: null
          });
          return;
        }

        // 선택/이동 모드
        if (ui.tool === "select") {
          const hit = hitTestText(pos.x, pos.y);

          if (hit) {
            // 텍스트 선택 + 드래그 준비
            setSelection({ texts: [hit.id], strokes: [] });

            const ox = pos.x - (hit.x || 0);
            const oy = pos.y - (hit.y || 0);
            draggingText.current = { active: true, id: hit.id, offsetX: ox, offsetY: oy };
            dragGhost.current = { active: true, id: hit.id, x: hit.x, y: hit.y };

            marquee.current = { down: false, startX: 0, startY: 0, started: false };
            setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });
          } else {
            // 빈 공간: 마키(영역 선택) 준비
            setSelection({ texts: [], strokes: [] });
            marquee.current = { down: true, startX: pos.x, startY: pos.y, started: false };
            setSelectBox({ active: false, x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y });

            draggingText.current = { active: false, id: null, offsetX: 0, offsetY: 0 };
            dragGhost.current = { active: false, id: null, x: null, y: null };
          }
          return;
        }

        // 펜 모드
        if (ui.tool === "pencil") {
          setSelection({ texts: [], strokes: [] });
          setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });

          drawing.current.isDrawing = true;
          drawing.current.points = [{ x: pos.x, y: pos.y }];
          return;
        }
      };

      const onPointerMove = (e) => {
        if (textInput.active) return;
        const pos = getPos(e);

        // 텍스트 드래그 이동
        if (ui.tool === "select" && draggingText.current.active && draggingText.current.id) {
          const nx = clamp01(pos.x - draggingText.current.offsetX);
          const ny = clamp01(pos.y - draggingText.current.offsetY);
          dragGhost.current = { active: true, id: draggingText.current.id, x: nx, y: ny };
          redraw();
          return;
        }

        // 마키 선택 박스
        if (ui.tool === "select" && marquee.current.down) {
          const dx = Math.abs(pos.rawX - downPosPx.current.x);
          const dy = Math.abs(pos.rawY - downPosPx.current.y);
          const threshold = 6;

          if (!marquee.current.started && (dx > threshold || dy > threshold)) {
            marquee.current.started = true;
            setSelectBox((b) => ({ ...b, active: true }));
          }

          if (marquee.current.started) {
            setSelectBox({ active: true, x1: marquee.current.startX, y1: marquee.current.startY, x2: pos.x, y2: pos.y });
          }
          return;
        }

        // 드로잉
        if (ui.tool === "pencil" && drawing.current.isDrawing) {
          drawing.current.points.push({ x: pos.x, y: pos.y });

          const ctx = canvasRef.current.getContext("2d");
          const { w, h } = getCanvasWH();
          const pts = drawing.current.points;
          const last = pts[pts.length - 2];

          ctx.beginPath();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = ui.color;
          ctx.lineWidth = ui.width;
          ctx.moveTo(last.x * w, last.y * h);
          ctx.lineTo(pos.x * w, pos.y * h);
          ctx.stroke();
        }
      };

      const onPointerUp = async (e) => {
        // 텍스트 드래그 종료 -> DB 업데이트
        if (ui.tool === "select" && draggingText.current.active && draggingText.current.id) {
          const id = draggingText.current.id;
          const finalX = dragGhost.current.x;
          const finalY = dragGhost.current.y;

          draggingText.current = { active: false, id: null, offsetX: 0, offsetY: 0 };
          dragGhost.current = { active: false, id: null, x: null, y: null };

          if (finalX != null && finalY != null) {
            try {
              await docRef("artifacts", roomInfo.id, "public", "data", "texts", id).update({
                x: finalX,
                y: finalY,
                updatedAt: serverTimestamp()
              });
              docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set(
                { lastActivity: serverTimestamp() },
                { merge: true }
              );
            } catch (err) {
              console.error("Text move update failed:", err);
            }
          }

          redraw();
          return;
        }

        // 마키 종료 -> 선택 확정
        if (ui.tool === "select" && marquee.current.down) {
          const wasStarted = marquee.current.started;
          marquee.current = { down: false, startX: 0, startY: 0, started: false };

          if (wasStarted) {
            const box = { ...selectBox };
            const selected = computeSelectionFromBox(box);
            setSelection(selected);
            setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });
          } else {
            // 클릭만 한 경우: 선택 유지/해제는 down에서 이미 처리됨
            setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });
          }
          redraw();
          return;
        }

        // 펜 종료 -> DB 저장
        if (ui.tool === "pencil" && drawing.current.isDrawing) {
          drawing.current.isDrawing = false;
          if (drawing.current.points.length < 2) return;

          try {
            await col("artifacts", roomInfo.id, "public", "data", "strokes").add({
              points: drawing.current.points,
              color: ui.color,
              width: ui.width,
              page: currentPage,
              userId: user.uid,
              userName: roomInfo.nickname,
              timestamp: serverTimestamp()
            });
            docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set(
              { lastActivity: serverTimestamp() },
              { merge: true }
            );
          } catch (err) {
            console.error("Stroke add failed:", err);
          }
        }
      };

      // 더블클릭: 텍스트 편집
      const onDoubleClick = (e) => {
        if (!isLoggedIn) return;
        if (ui.tool !== "select") return;
        if (textInput.active) return;

        const pos = getPos(e);
        const hit = hitTestText(pos.x, pos.y);
        if (!hit) return;

        setSelection({ texts: [hit.id], strokes: [] });
        setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });

        setTextInput({
          active: true,
          x: hit.x, y: hit.y,
          rawX: pos.rawX, rawY: pos.rawY,
          value: hit.text || "",
          mode: "edit",
          targetId: hit.id
        });
      };

      // --- Undo (내 마지막 stroke/text) ---
      const undoLast = async () => {
        if (!user) return;

        const myStrokes = data.strokes.filter((s) => s.userId === user.uid && (s.page || 1) === currentPage);
        const myTexts = data.texts.filter((t) => t.userId === user.uid && (t.page || 1) === currentPage);

        const lastStroke = myStrokes[myStrokes.length - 1];
        const lastText = myTexts[myTexts.length - 1];

        if (!lastStroke && !lastText) return;

        let target;
        if (!lastStroke) target = { id: lastText.id, col: "texts" };
        else if (!lastText) target = { id: lastStroke.id, col: "strokes" };
        else {
          const sTime = lastStroke.timestamp?.toMillis?.() || 0;
          const tTime = lastText.timestamp?.toMillis?.() || 0;
          target = sTime > tTime ? { id: lastStroke.id, col: "strokes" } : { id: lastText.id, col: "texts" };
        }

        try {
          await docRef("artifacts", roomInfo.id, "public", "data", target.col, target.id).delete();
          setSelection((p) => ({
            texts: p.texts.filter(x => x !== target.id),
            strokes: p.strokes.filter(x => x !== target.id),
          }));
        } catch (err) {
          console.error("Undo delete failed:", err);
        }
      };

      // --- ✅ 선택 영역 일괄 삭제 (texts + strokes) ---
      const deleteSelectionBatch = async () => {
        const total = selection.texts.length + selection.strokes.length;
        if (total === 0) return;

        if (!confirm(`선택된 항목 ${total}개를 삭제할까요?`)) return;

        try {
          const batch = db.batch();

          for (const id of selection.texts) {
            batch.delete(docRef("artifacts", roomInfo.id, "public", "data", "texts", id));
          }
          for (const id of selection.strokes) {
            batch.delete(docRef("artifacts", roomInfo.id, "public", "data", "strokes", id));
          }

          await batch.commit();

          setSelection({ texts: [], strokes: [] });
          setSelectBox({ active: false, x1: 0, y1: 0, x2: 0, y2: 0 });

          docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set(
            { lastActivity: serverTimestamp() },
            { merge: true }
          );
        } catch (err) {
          console.error("Batch delete failed:", err);
          alert("삭제에 실패했습니다. 콘솔 로그를 확인해주세요.");
        }
      };

      const generateNewRoomId = () => {
        const randomId = "Room-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        setRoomInfo((p) => ({ ...p, id: randomId }));
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (!roomInfo.nickname.trim() || !roomInfo.id.trim()) return;
        localStorage.setItem("eboard_nick", roomInfo.nickname);
        setIsLoggedIn(true);
      };

      // --- Login page ---
      if (!isLoggedIn) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-gray-900 p-6 overflow-y-auto">
            <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
              <div className="bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6">
                <div>
                  <h1 className="text-3xl font-black text-white bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 uppercase tracking-tighter">
                    E-Board Collab
                  </h1>
                  <p className="text-gray-400 text-sm mt-1">실시간 협업을 위한 스마트 칠판</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div className="space-y-4">
                    <div>
                      <label className="text-[10px] text-gray-500 mb-1 block uppercase font-bold tracking-widest">
                        사용자 닉네임
                      </label>
                      <input
                        type="text"
                        value={roomInfo.nickname}
                        onChange={(e) => setRoomInfo((p) => ({ ...p, nickname: e.target.value }))}
                        className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition"
                        placeholder="이름을 입력하세요"
                        required
                      />
                    </div>

                    <div className="pt-2">
                      <div className="flex justify-between items-end mb-1">
                        <label className="text-[10px] text-gray-500 uppercase font-bold tracking-widest">
                          방 이름 (ID)
                        </label>
                        <button
                          type="button"
                          onClick={generateNewRoomId}
                          className="text-[10px] text-emerald-400 font-bold hover:underline flex items-center gap-1"
                        >
                          <Icons.Plus /> 새 회의 만들기
                        </button>
                      </div>
                      <input
                        type="text"
                        value={roomInfo.id}
                        onChange={(e) => setRoomInfo((p) => ({ ...p, id: e.target.value }))}
                        className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition"
                        placeholder="예: RoomA, Project1"
                        required
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-500/20 uppercase tracking-widest mt-4"
                  >
                    입장하기
                  </button>
                </form>
              </div>

              <div className="space-y-4">
                <div className="flex items-center justify-between px-2">
                  <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">활동 중인 회의 목록</h2>
                  <span className="text-[10px] bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full border border-gray-700">
                    Lobby
                  </span>
                </div>

                <div className="space-y-2 max-h-[480px] overflow-y-auto pr-2 custom-scrollbar">
                  {activeRooms.length === 0 ? (
                    <div className="p-12 border-2 border-dashed border-gray-800 rounded-3xl text-center flex flex-col items-center gap-3">
                      <div className="p-3 bg-gray-800 rounded-full text-gray-600">
                        <Icons.Users />
                      </div>
                      <div className="text-gray-600 text-sm font-medium">
                        현재 진행 중인 회의가 없습니다.
                        <br />
                        <span className="text-xs opacity-60">새 회의를 직접 만들어보세요!</span>
                      </div>
                    </div>
                  ) : (
                    activeRooms.map((room) => (
                      <button
                        key={room.id}
                        onClick={() => setRoomInfo((p) => ({ ...p, id: room.id }))}
                        className="w-full room-card bg-gray-800/40 hover:bg-gray-800 border border-gray-700/50 hover:border-emerald-500/50 p-5 rounded-2xl flex justify-between items-center transition group text-left shadow-sm"
                      >
                        <div className="space-y-1">
                          <div className="text-emerald-400 font-black text-xl tracking-tight uppercase">{room.id}</div>
                          <div className="flex items-center gap-2 text-[10px] text-gray-500 font-mono">
                            <Icons.Users />
                            <span>
                              최근 활동:{" "}
                              {room.lastActivity?.toMillis?.()
                                ? new Date(room.lastActivity.toMillis()).toLocaleTimeString()
                                : "방금 전"}
                            </span>
                          </div>
                        </div>
                        <div className="h-10 w-10 flex items-center justify-center rounded-xl bg-emerald-500/10 text-emerald-500 group-hover:bg-emerald-500 group-hover:text-white transition-all">
                          →
                        </div>
                      </button>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // --- Board page ---
      const selectedCount = selection.texts.length + selection.strokes.length;

      return (
        <div className="h-screen w-full flex flex-col bg-gray-950 text-white overflow-hidden">
          <header className="h-14 glass-panel border-b border-gray-800 flex items-center justify-between px-6 z-20">
            <div className="flex items-center gap-4">
              <span className="font-black text-lg text-emerald-400 tracking-tighter">BOARD.</span>
              <div className="h-6 w-px bg-gray-800 mx-1" />
              <div className="flex items-center gap-2 text-[10px] font-mono text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800">
                <span className="text-white">ROOM: {roomInfo.id}</span>
                <span className="text-emerald-500 font-bold uppercase">● {data.users.length} ONLINE</span>
              </div>
              {ui.tool === "select" && selectedCount > 0 && (
                <div className="ml-2 text-[10px] font-mono text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-2 py-1 rounded-full">
                  SELECTED: {selectedCount}
                </div>
              )}
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setCurrentPage((p) => Math.max(1, p - 1))}
                className="p-1 hover:bg-gray-800 rounded text-gray-400 disabled:opacity-40"
                disabled={currentPage === 1}
              >
                ◀
              </button>
              <span className="text-xs font-bold font-mono">P. {currentPage}</span>
              <button onClick={() => setCurrentPage((p) => p + 1)} className="p-1 hover:bg-gray-800 rounded text-gray-400">
                ▶
              </button>

              <div className="h-6 w-px bg-gray-800 mx-1" />
              <button
                onClick={() => setUi((p) => ({ ...p, showChat: !p.showChat }))}
                className={`p-2 rounded-lg transition ${ui.showChat ? "bg-emerald-500/20 text-emerald-400" : "hover:bg-gray-800"}`}
              >
                💬
              </button>
              <button
                onClick={() => { if (confirm("회의에서 나가시겠습니까?")) window.location.reload(); }}
                className="p-2 text-xs font-bold text-gray-500 hover:text-white transition"
              >
                LEAVE
              </button>
            </div>
          </header>

          <div className="flex-1 flex relative">
            <div
              ref={containerRef}
              className="flex-1 relative overflow-hidden bg-[radial-gradient(#1f2937_1px,transparent_1px)] [background-size:24px_24px]"
            >
              <canvas
                ref={canvasRef}
                onPointerDown={onPointerDown}
                onPointerMove={onPointerMove}
                onPointerUp={onPointerUp}
                onPointerCancel={onPointerUp}
                onDoubleClick={onDoubleClick}
                className="block"
                // ✅ 텍스트 입력 중에는 캔버스가 방해하지 않도록
                style={{
                  touchAction: (ui.tool === "pencil") ? "none" : "auto",
                  pointerEvents: textInput.active ? "none" : "auto"
                }}
              />

              {textInput.active && (
                <input
                  ref={textRef}
                  type="text"
                  className="text-input-overlay"
                  style={{
                    left: textInput.rawX,
                    top: textInput.rawY - (ui.width * 2),
                    color: ui.color,
                    fontSize: `${Math.max(16, ui.width * 4)}px`
                  }}
                  value={textInput.value}
                  onChange={(e) => setTextInput((p) => ({ ...p, value: e.target.value }))}
                  onBlur={() => submitText("blur")}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      e.preventDefault();
                      submitText("enter");
                      e.currentTarget.blur();
                    }
                    if (e.key === "Escape") {
                      e.preventDefault();
                      setTextInput({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: "", mode: "create", targetId: null });
                    }
                  }}
                  autoFocus
                />
              )}

              {/* Bottom Tool Bar */}
              <div className="absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel border border-gray-700 px-6 py-3 rounded-3xl flex items-center gap-6 shadow-2xl">
                {/* tools */}
                <div className="flex gap-2 p-1 bg-gray-900/50 rounded-xl">
                  <button
                    onClick={() => setUi((p) => ({ ...p, tool: "pencil" }))}
                    className={`p-2 rounded-lg transition ${ui.tool === "pencil" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white"}`}
                    title="펜"
                  >
                    <Icons.Pencil />
                  </button>
                  <button
                    onClick={() => setUi((p) => ({ ...p, tool: "text" }))}
                    className={`p-2 rounded-lg transition ${ui.tool === "text" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white"}`}
                    title="텍스트 추가"
                  >
                    <Icons.Text />
                  </button>
                  <button
                    onClick={() => setUi((p) => ({ ...p, tool: "select" }))}
                    className={`p-2 rounded-lg transition ${ui.tool === "select" ? "bg-emerald-500 text-white" : "text-gray-400 hover:text-white"}`}
                    title="선택/영역 선택"
                  >
                    <Icons.Select />
                  </button>
                </div>

                {/* colors */}
                <div className="flex gap-3">
                  {["#10b981", "#ef4444", "#3b82f6", "#ffffff"].map((c) => (
                    <button
                      key={c}
                      onClick={() => setUi((p) => ({ ...p, color: c }))}
                      className={`w-6 h-6 rounded-full border-2 ${ui.color === c ? "border-white scale-110 ring-4 ring-white/10" : "border-transparent opacity-60"}`}
                      style={{ backgroundColor: c }}
                      title="색상"
                    />
                  ))}
                </div>

                {/* actions */}
                <div className="flex gap-2">
                  <button onClick={undoLast} className="p-2 hover:bg-gray-700 rounded-xl text-gray-400 hover:text-white" title="Undo">
                    <Icons.Undo />
                  </button>

                  <button
                    onClick={deleteSelectionBatch}
                    disabled={selectedCount === 0}
                    className={`p-2 rounded-xl transition ${selectedCount > 0 ? "hover:bg-red-500/20 text-gray-400 hover:text-red-400" : "opacity-40 text-gray-500 cursor-not-allowed"}`}
                    title="선택 항목 일괄 삭제"
                  >
                    <Icons.Trash />
                  </button>
                </div>

                {/* hint */}
                {ui.tool === "select" && (
                  <div className="hidden md:block text-[10px] text-gray-400 font-mono">
                    텍스트 클릭: 선택 · 텍스트 드래그: 이동 · 텍스트 더블클릭: 수정 · 빈 곳 드래그: 영역 선택 · 🗑: 일괄 삭제
                  </div>
                )}
              </div>
            </div>

            {/* Chat panel */}
            <div className={`transition-all duration-300 ${ui.showChat ? "w-80 border-l border-gray-800" : "w-0 overflow-hidden"} flex flex-col glass-panel`}>
              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {data.messages.map((m, i) => (
                  <div key={m.id || i} className={`flex flex-col ${m.userId === user?.uid ? "items-end" : "items-start"}`}>
                    <span className="text-[10px] text-gray-500 mb-1 px-1 font-mono uppercase tracking-tighter">{m.userName}</span>
                    <div className={`max-w-[90%] px-3 py-2 text-sm rounded-2xl shadow-sm ${m.userId === user?.uid ? "bg-emerald-600 text-white rounded-tr-none" : "bg-gray-800 text-gray-200 rounded-tl-none border border-gray-700/50"}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <form
                onSubmit={async (e) => {
                  e.preventDefault();
                  if (!ui.msg.trim()) return;
                  const m = ui.msg;
                  setUi((p) => ({ ...p, msg: "" }));

                  await col("artifacts", roomInfo.id, "public", "data", "messages").add({
                    text: m,
                    userId: user.uid,
                    userName: roomInfo.nickname,
                    timestamp: serverTimestamp()
                  });

                  docRef("artifacts", globalAppId, "public", "data", "active_rooms", roomInfo.id).set(
                    { lastActivity: serverTimestamp() },
                    { merge: true }
                  );
                }}
                className="p-4 bg-gray-900 border-t border-gray-800 flex gap-2"
              >
                <input
                  type="text"
                  value={ui.msg}
                  onChange={(e) => setUi((p) => ({ ...p, msg: e.target.value }))}
                  placeholder="채팅 입력..."
                  className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500"
                />
                <button
                  type="submit"
                  disabled={!ui.msg.trim()}
                  className="p-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl transition disabled:opacity-50"
                >
                  <Icons.Send />
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
