<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Collab E-Board</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        body { background-color: #111827; margin: 0; overflow: hidden; touch-action: none; }
        canvas { touch-action: none; cursor: crosshair; }
        .glass-panel { background: rgba(31, 41, 55, 0.85); backdrop-filter: blur(10px); }
        .text-input-overlay {
            position: absolute;
            background: transparent;
            border: 1px dashed #10b981;
            color: white;
            outline: none;
            padding: 2px;
            font-family: sans-serif;
            z-index: 50;
            white-space: nowrap;
        }
        .room-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, writeBatch, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef, useCallback } = React;

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDK2VURk2eqaRy52yi2sPZuwYVb2ymmR3I",
            authDomain: "eboard-95055.firebaseapp.com",
            databaseURL: "https://eboard-95055-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "eboard-95055",
            storageBucket: "eboard-95055.firebasestorage.app",
            messagingSenderId: "927523134440",
            appId: "1:927523134440:web:4a546e6c565368e283e25d",
            measurementId: "G-BCPK0YX0E3"
        };

        const globalAppId = typeof __app_id !== 'undefined' ? __app_id : 'vibe-board-lobby';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const Icons = {
            Pencil: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Text: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M12 6v14m-5 0h10" /></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Send: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
            Undo: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [roomInfo, setRoomInfo] = useState({
                id: '',
                nickname: localStorage.getItem('eboard_nick') || ''
            });
            
            const [activeRooms, setActiveRooms] = useState([]);
            const [currentPage, setCurrentPage] = useState(1);
            const [data, setData] = useState({ strokes: [], texts: [], messages: [], users: [] });
            const [ui, setUi] = useState({ color: '#10b981', width: 4, showChat: true, msg: '', tool: 'pencil' });
            const [textInput, setTextInput] = useState({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: '' });

            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const drawing = useRef({ isDrawing: false, points: [] });
            const textRef = useRef(null);

            // 1. Auth & Lobby Listeners
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth failed:", err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, u => setUser(u));

                // Lobby Listener: 활동중인 방 목록 실시간 감시
                const unsubLobby = onSnapshot(collection(db, 'artifacts', globalAppId, 'public', 'data', 'active_rooms'), s => {
                    const rooms = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    setActiveRooms(rooms.sort((a, b) => (b.lastActivity?.toMillis() || 0) - (a.lastActivity?.toMillis() || 0)));
                });

                return () => { unsubscribe(); unsubLobby(); };
            }, []);

            // 2. Room Data Sync
            useEffect(() => {
                if (!user || !isLoggedIn) return;
                
                const base = ['artifacts', roomInfo.id, 'public', 'data'];
                const sortByTime = (docs) => [...docs].sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));

                const unsubStrokes = onSnapshot(collection(db, ...base, 'strokes'), s => {
                    setData(p => ({ ...p, strokes: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) }));
                });

                const unsubTexts = onSnapshot(collection(db, ...base, 'texts'), s => {
                    setData(p => ({ ...p, texts: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) }));
                });

                const unsubMessages = onSnapshot(collection(db, ...base, 'messages'), s => {
                    setData(p => ({ ...p, messages: sortByTime(s.docs.map(d => ({ id: d.id, ...d.data() }))) }));
                });

                const unsubUsers = onSnapshot(collection(db, ...base, 'users'), s => {
                    setData(p => ({ ...p, users: s.docs.map(d => ({ id: d.id, ...d.data() })) }));
                });

                // 사용자 입장 및 방 활성화 상태 업데이트
                setDoc(doc(db, ...base, 'users', user.uid), {
                    name: roomInfo.nickname, uid: user.uid, lastSeen: serverTimestamp()
                });
                
                // Lobby에 현재 방 상태 기록 (다른 사용자들이 볼 수 있도록)
                setDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'active_rooms', roomInfo.id), {
                    lastActivity: serverTimestamp(),
                    activeUserCount: data.users.length + 1
                }, { merge: true });

                return () => { unsubStrokes(); unsubTexts(); unsubMessages(); unsubUsers(); };
            }, [user, isLoggedIn, roomInfo.id]);

            // 3. Canvas Logic
            const redraw = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                
                data.strokes.filter(s => (s.page || 1) === currentPage).forEach(s => {
                    if (!s.points || s.points.length < 2) return;
                    ctx.beginPath(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
                    ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
                    s.points.slice(1).forEach(p => ctx.lineTo(p.x * w, p.y * h));
                    ctx.stroke();
                });

                data.texts.filter(t => (t.page || 1) === currentPage).forEach(t => {
                    ctx.fillStyle = t.color;
                    ctx.font = `${Math.max(14, t.fontSize * 4)}px sans-serif`;
                    ctx.fillText(t.text, t.x * w, t.y * h);
                });
            }, [data.strokes, data.texts, currentPage]);

            useEffect(() => { redraw(); }, [redraw]);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) / rect.width,
                    y: (clientY - rect.top) / rect.height,
                    rawX: clientX - rect.left, rawY: clientY - rect.top
                };
            };

            const drawStart = (e) => {
                if (!isLoggedIn) return;
                const pos = getPos(e);
                if (ui.tool === 'text') {
                    setTextInput({ active: true, x: pos.x, y: pos.y, rawX: pos.rawX, rawY: pos.rawY, value: '' });
                    return;
                }
                drawing.current.isDrawing = true;
                drawing.current.points = [{ x: pos.x, y: pos.y }];
            };

            const drawMove = (e) => {
                if (!drawing.current.isDrawing) return;
                const pos = getPos(e);
                drawing.current.points.push({ x: pos.x, y: pos.y });
                const ctx = canvasRef.current.getContext('2d');
                const last = drawing.current.points[drawing.current.points.length - 2];
                const dpr = window.devicePixelRatio || 1;
                ctx.beginPath(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = ui.color; ctx.lineWidth = ui.width;
                ctx.moveTo(last.x * (canvasRef.current.width/dpr), last.y * (canvasRef.current.height/dpr));
                ctx.lineTo(pos.x * (canvasRef.current.width/dpr), pos.y * (canvasRef.current.height/dpr));
                ctx.stroke();
            };

            const drawEnd = async () => {
                if (!drawing.current.isDrawing) return;
                drawing.current.isDrawing = false;
                if (drawing.current.points.length < 2) return;
                await addDoc(collection(db, 'artifacts', roomInfo.id, 'public', 'data', 'strokes'), {
                    points: drawing.current.points, color: ui.color, width: ui.width,
                    page: currentPage, userId: user.uid, userName: roomInfo.nickname, timestamp: serverTimestamp()
                });
                // 활동 발생 시 로비 데이터 갱신
                setDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'active_rooms', roomInfo.id), { lastActivity: serverTimestamp() }, { merge: true });
            };

            const submitText = async () => {
                if (!textInput.value.trim()) { setTextInput(p => ({ ...p, active: false })); return; }
                const payload = {
                    text: textInput.value, x: textInput.x, y: textInput.y, color: ui.color,
                    fontSize: ui.width * 2, page: currentPage, userId: user.uid, userName: roomInfo.nickname, timestamp: serverTimestamp()
                };
                setTextInput({ active: false, x: 0, y: 0, rawX: 0, rawY: 0, value: '' });
                await addDoc(collection(db, 'artifacts', roomInfo.id, 'public', 'data', 'texts'), payload);
                setDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'active_rooms', roomInfo.id), { lastActivity: serverTimestamp() }, { merge: true });
            };

            const undoLast = async () => {
                if (!user) return;
                const myStrokes = data.strokes.filter(s => s.userId === user.uid && (s.page || 1) === currentPage);
                const myTexts = data.texts.filter(t => t.userId === user.uid && (t.page || 1) === currentPage);
                const lastStroke = myStrokes[myStrokes.length - 1];
                const lastText = myTexts[myTexts.length - 1];
                if (!lastStroke && !lastText) return;
                let target;
                if (!lastStroke) target = { id: lastText.id, col: 'texts' };
                else if (!lastText) target = { id: lastStroke.id, col: 'strokes' };
                else {
                    const sTime = lastStroke.timestamp?.toMillis() || 0;
                    const tTime = lastText.timestamp?.toMillis() || 0;
                    target = sTime > tTime ? { id: lastStroke.id, col: 'strokes' } : { id: lastText.id, col: 'texts' };
                }
                await deleteDoc(doc(db, 'artifacts', roomInfo.id, 'public', 'data', target.col, target.id));
            };

            const generateNewRoomId = () => {
                const randomId = 'Room-' + Math.random().toString(36).substring(2, 7).toUpperCase();
                setRoomInfo(p => ({ ...p, id: randomId }));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!roomInfo.nickname.trim() || !roomInfo.id.trim()) return;
                localStorage.setItem('eboard_nick', roomInfo.nickname);
                setIsLoggedIn(true);
            };

            useEffect(() => {
                const resize = () => {
                    if (!containerRef.current || !canvasRef.current) return;
                    const { width, height } = containerRef.current.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    canvasRef.current.width = width * dpr; canvasRef.current.height = height * dpr;
                    canvasRef.current.getContext('2d').scale(dpr, dpr);
                    canvasRef.current.style.width = `${width}px`; canvasRef.current.style.height = `${height}px`;
                    redraw();
                };
                window.addEventListener('resize', resize); resize();
                return () => window.removeEventListener('resize', resize);
            }, [redraw]);

            if (!isLoggedIn) {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-gray-900 p-6 overflow-y-auto">
                        <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                            {/* Login & Create Section */}
                            <div className="bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6">
                                <div>
                                    <h1 className="text-3xl font-black text-white bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 uppercase tracking-tighter">E-Board Collab</h1>
                                    <p className="text-gray-400 text-sm mt-1">실시간 협업을 위한 스마트 칠판</p>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] text-gray-500 mb-1 block uppercase font-bold tracking-widest">사용자 닉네임</label>
                                            <input type="text" value={roomInfo.nickname} onChange={e => setRoomInfo(p => ({...p, nickname: e.target.value}))} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="이름을 입력하세요" required />
                                        </div>
                                        
                                        <div className="pt-2">
                                            <div className="flex justify-between items-end mb-1">
                                                <label className="text-[10px] text-gray-500 uppercase font-bold tracking-widest">방 이름 (ID)</label>
                                                <button type="button" onClick={generateNewRoomId} className="text-[10px] text-emerald-400 font-bold hover:underline flex items-center gap-1">
                                                    <Icons.Plus /> 새 회의 만들기
                                                </button>
                                            </div>
                                            <input type="text" value={roomInfo.id} onChange={e => setRoomInfo(p => ({...p, id: e.target.value}))} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="예: RoomA, Project1" required />
                                        </div>
                                    </div>
                                    
                                    <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-500/20 uppercase tracking-widest mt-4">입장하기</button>
                                </form>
                            </div>

                            {/* Lobby / Active Rooms List */}
                            <div className="space-y-4">
                                <div className="flex items-center justify-between px-2">
                                    <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">활동 중인 회의 목록</h2>
                                    <span className="text-[10px] bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full border border-gray-700">Lobby</span>
                                </div>
                                
                                <div className="space-y-2 max-h-[480px] overflow-y-auto pr-2 custom-scrollbar">
                                    {activeRooms.length === 0 ? (
                                        <div className="p-12 border-2 border-dashed border-gray-800 rounded-3xl text-center flex flex-col items-center gap-3">
                                            <div className="p-3 bg-gray-800 rounded-full text-gray-600"><Icons.Users /></div>
                                            <div className="text-gray-600 text-sm font-medium">현재 진행 중인 회의가 없습니다.<br/><span className="text-xs opacity-60">새 회의를 직접 만들어보세요!</span></div>
                                        </div>
                                    ) : (
                                        activeRooms.map(room => (
                                            <button 
                                                key={room.id}
                                                onClick={() => setRoomInfo(p => ({ ...p, id: room.id }))}
                                                className="w-full room-card bg-gray-800/40 hover:bg-gray-800 border border-gray-700/50 hover:border-emerald-500/50 p-5 rounded-2xl flex justify-between items-center transition group text-left shadow-sm"
                                            >
                                                <div className="space-y-1">
                                                    <div className="text-emerald-400 font-black text-xl tracking-tight uppercase">{room.id}</div>
                                                    <div className="flex items-center gap-2 text-[10px] text-gray-500 font-mono">
                                                        <Icons.Users />
                                                        <span>최근 활동: {room.lastActivity?.toMillis() ? new Date(room.lastActivity.toMillis()).toLocaleTimeString() : '방금 전'}</span>
                                                    </div>
                                                </div>
                                                <div className="h-10 w-10 flex items-center justify-center rounded-xl bg-emerald-500/10 text-emerald-500 group-hover:bg-emerald-500 group-hover:text-white transition-all">
                                                    →
                                                </div>
                                            </button>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full flex flex-col bg-gray-950 text-white overflow-hidden">
                    <header className="h-14 glass-panel border-b border-gray-800 flex items-center justify-between px-6 z-20">
                        <div className="flex items-center gap-4">
                            <span className="font-black text-lg text-emerald-400 tracking-tighter">BOARD.</span>
                            <div className="h-6 w-px bg-gray-800 mx-1" />
                            <div className="flex items-center gap-2 text-[10px] font-mono text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800">
                                <span className="text-white">ROOM: {roomInfo.id}</span>
                                <span className="text-emerald-500 font-bold uppercase">● {data.users.length} ONLINE</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="p-1 hover:bg-gray-800 rounded text-gray-400" disabled={currentPage === 1}>◀</button>
                            <span className="text-xs font-bold font-mono">P. {currentPage}</span>
                            <button onClick={() => setCurrentPage(p => p + 1)} className="p-1 hover:bg-gray-800 rounded text-gray-400">▶</button>
                            <div className="h-6 w-px bg-gray-800 mx-1" />
                            <button onClick={() => setUi(p => ({...p, showChat: !p.showChat}))} className={`p-2 rounded-lg transition ${ui.showChat ? 'bg-emerald-500/20 text-emerald-400' : 'hover:bg-gray-800'}`}>💬</button>
                            <button onClick={() => { if(confirm('회의에서 나가시겠습니까?')) window.location.reload(); }} className="p-2 text-xs font-bold text-gray-500 hover:text-white transition">LEAVE</button>
                        </div>
                    </header>

                    <div className="flex-1 flex relative">
                        <div ref={containerRef} className="flex-1 relative overflow-hidden bg-[radial-gradient(#1f2937_1px,transparent_1px)] [background-size:24px_24px]">
                            <canvas ref={canvasRef} onMouseDown={drawStart} onMouseMove={drawMove} onMouseUp={drawEnd} onMouseLeave={drawEnd} onTouchStart={drawStart} onTouchMove={drawMove} onTouchEnd={drawEnd} className="block" />
                            
                            {textInput.active && (
                                <input ref={textRef} type="text" className="text-input-overlay" style={{ left: textInput.rawX, top: textInput.rawY - (ui.width * 2), color: ui.color, fontSize: `${Math.max(14, ui.width * 4)}px`, minWidth: '120px' }} value={textInput.value} onChange={e => setTextInput(p => ({ ...p, value: e.target.value }))} onBlur={submitText} onKeyDown={e => e.key === 'Enter' && submitText()} autoFocus />
                            )}

                            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel border border-gray-700 px-6 py-3 rounded-3xl flex items-center gap-6 shadow-2xl">
                                <div className="flex gap-2 p-1 bg-gray-900/50 rounded-xl">
                                    <button onClick={() => setUi(p => ({ ...p, tool: 'pencil' }))} className={`p-2 rounded-lg transition ${ui.tool === 'pencil' ? 'bg-emerald-500 text-white' : 'text-gray-400 hover:text-white'}`}><Icons.Pencil /></button>
                                    <button onClick={() => setUi(p => ({ ...p, tool: 'text' }))} className={`p-2 rounded-lg transition ${ui.tool === 'text' ? 'bg-emerald-500 text-white' : 'text-gray-400 hover:text-white'}`}><Icons.Text /></button>
                                </div>
                                <div className="flex gap-3">
                                    {['#10b981', '#ef4444', '#3b82f6', '#ffffff'].map(c => (
                                        <button key={c} onClick={() => setUi(p => ({ ...p, color: c }))} className={`w-6 h-6 rounded-full border-2 ${ui.color === c ? 'border-white scale-110 ring-4 ring-white/10' : 'border-transparent opacity-60'}`} style={{ backgroundColor: c }} />
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={undoLast} className="p-2 hover:bg-gray-700 rounded-xl text-gray-400 hover:text-white"><Icons.Undo /></button>
                                    <button onClick={() => { if(confirm('모든 내용을 지울까요?')) addDoc(collection(db, 'artifacts', roomInfo.id, 'public', 'data', 'messages'), { text: '🚨 페이지 초기화됨', userName: 'System', timestamp: serverTimestamp() }); }} className="p-2 hover:bg-red-500/20 rounded-xl text-gray-400 hover:text-red-400"><Icons.Trash /></button>
                                </div>
                            </div>
                        </div>

                        <div className={`transition-all duration-300 ${ui.showChat ? 'w-80 border-l border-gray-800' : 'w-0 overflow-hidden'} flex flex-col glass-panel`}>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {data.messages.map((m, i) => (
                                    <div key={m.id || i} className={`flex flex-col ${m.userId === user?.uid ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] text-gray-500 mb-1 px-1 font-mono uppercase tracking-tighter">{m.userName}</span>
                                        <div className={`max-w-[90%] px-3 py-2 text-sm rounded-2xl shadow-sm ${m.userId === user?.uid ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-gray-800 text-gray-200 rounded-tl-none border border-gray-700/50'}`}>{m.text}</div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                if (!ui.msg.trim()) return;
                                const m = ui.msg; setUi(p => ({ ...p, msg: '' }));
                                await addDoc(collection(db, 'artifacts', roomInfo.id, 'public', 'data', 'messages'), {
                                    text: m, userId: user.uid, userName: roomInfo.nickname, timestamp: serverTimestamp()
                                });
                                setDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'active_rooms', roomInfo.id), { lastActivity: serverTimestamp() }, { merge: true });
                            }} className="p-4 bg-gray-900 border-t border-gray-800 flex gap-2">
                                <input type="text" value={ui.msg} onChange={e => setUi(p => ({ ...p, msg: e.target.value }))} placeholder="채팅 입력..." className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500" />
                                <button type="submit" disabled={!ui.msg.trim()} className="p-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl transition disabled:opacity-50"><Icons.Send /></button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
